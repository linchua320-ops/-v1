function field(label,id,val){
  return '<div class="field"><label>'+esc(label)+'</label><input id="'+id+'" value="'+esc(val||'')+'"></div>';
}
function textareaField(label,id,val){
  return '<div class="field"><label>'+esc(label)+'</label><textarea id="'+id+'">'+esc(val||'')+'</textarea></div>';
}
function bindSettingsInputs(v){
  var map = {set_companyName:'companyName',set_companySub:'companySub',set_companyAddr:'companyAddr',
    set_companyTel:'companyTel',set_companyFax:'companyFax',set_agentName:'agentName',set_agentPhone:'agentPhone',set_bankInfo:'bankInfo'};
  Object.keys(map).forEach(function(id){
    var el = v.querySelector('#'+id);
    if(!el) return;
    el.oninput = function(){ STATE.settings[map[id]] = el.value; saveSettings(); };
  });
}

/* ---------------- render: editor ---------------- */
function renderEditor(v){
  var q = STATE.current;
  var t = TYPES[q.type];
  var totals = calcTotals(q);

  var html = '';

  // basic info
  html += '<div class="card"><h2>基本資料</h2>'+
    '<div class="row2">'+qfield('客戶／公司','cu_company',q.customer.company)+qfield('聯絡人','cu_contact',q.customer.contact)+'</div>'+
    '<div class="row2">'+qfield('手機','cu_mobile',q.customer.mobile)+qfield('電話／TEL','cu_tel',q.customer.tel)+'</div>'+
    qfield('安裝地址','cu_address',q.customer.address)+
    '<div class="row2">'+qfield('報價日期','cu_date',q.date,'date')+qfield('交貨備註','cu_deliveryNote',q.customer.deliveryNote)+'</div>'+
    qfield('備註','cu_note',q.customer.note)+
  '</div>';

  // items
  html += '<div class="card"><h2>品項清單 <span class="cnt">('+q.items.length+')</span></h2><div id="itemsWrap">';
  q.items.forEach(function(it, idx){ html += renderItemCard(it, idx, q.items.length); });
  html += '</div><div style="display:flex;gap:8px;margin-top:4px;">'+
    '<button class="addbtn" id="btnAddItem" style="flex:1;">＋ 新增品項</button>'+
    '<button class="addbtn" id="btnCalcImport" style="flex:1;">🧮 用試算表新增</button>'+
  '</div></div>';

  // extra items (勾選才顯示，可手動新增)
  html += renderExtraCard(q);

  // totals
  html += '<div class="totalbox">';
  html += '<div class="tl"><span>品項小計</span><span>$'+money(totals.itemsTotal + totals.filmTotal)+'</span></div>';
  html += '<div class="tl"><span>加項小計</span><span>$'+money(totals.extraTotal)+'</span></div>';
  if(t.showTax){
    html += '<div class="tl"><span>未稅金額</span><span>$'+money(totals.untaxed)+'</span></div>';
    html += '<div class="tl"><span>稅金 (5%)</span><span>$'+money(totals.tax)+'</span></div>';
  }
  html += '<div class="tl main"><span>'+esc(t.totalLabel)+'</span><span>$'+money(totals.grand)+'</span></div>';
  html += '</div>';

  // terms
  migrateTerms(q);
  html += renderTermsCard(q);

  // agent + signature
  html += '<div class="card"><h2>經辦人資訊</h2>'+
    '<div class="row2">'+qfield('經辦人','ag_name',q.agentName)+qfield('聯絡電話','ag_phone',q.agentPhone)+'</div>'+
  '</div>';

  html += '<div class="card"><h2>客戶簽章 <span class="cnt">（手指簽名，選填）</span></h2>'+
    '<div class="sigwrap"><canvas id="sigCanvas"></canvas></div>'+
    '<div class="sigfoot"><span>簽名將顯示於 PDF 客戶簽章欄</span><button class="linebtn" id="btnClearSig">清除</button></div>'+
  '</div>';

  html += '<div class="savehint" id="savehintBottom">已儲存</div>';

  html += '<div class="actionbar">'+
    '<button class="btn btn-outline" id="btnDuplicate">複製一份</button>'+
    '<button class="btn btn-outline" id="btnPreview">👁 預覽報價單</button>'+
    '<button class="btn btn-primary" id="btnPdf">📄 匯出 PDF</button>'+
  '</div>';

  v.innerHTML = html;
  bindEditorEvents(v);
  initSignaturePad(v, q.signature);
}

function qfield(label,id,val,type){
  return '<div class="field"><label>'+esc(label)+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val||'')+'"></div>';
}

function renderTermsCard(q){
  var itemsHtml = (q.termsItems||[]).map(function(it){
    return '<div class="termsitem" data-tid="'+it.id+'">'+
      '<input type="checkbox" data-tf="enabled" data-tid="'+it.id+'" '+(it.enabled?'checked':'')+'>'+
      '<input type="text" data-tf="text" data-tid="'+it.id+'" value="'+esc(it.text)+'" placeholder="備註內容"'+(it.enabled?'':' disabled')+'>'+
      '<button class="tdel" data-tid="'+it.id+'">✕</button>'+
    '</div>';
  }).join('');
  return '<div class="card">'+
    '<h2>備註事項 <span class="cnt">(勾選要顯示的項目，會自動依序編號)</span></h2>'+
    '<div id="termsList">'+itemsHtml+'</div>'+
    '<div class="termsactions">'+
      '<button class="linebtn" id="btnAddTerm">＋ 新增備註</button>'+
      '<button class="linebtn" id="btnResetTerms" style="background:var(--bg);color:var(--muted);">還原公版</button>'+
    '</div>'+
  '</div>'+
  '<div class="card termsbox">'+
    '<h2>其他附註 <span class="cnt">(付款方式／有效期限等，不編號)</span></h2>'+
    '<textarea id="plainNotesInput">'+esc(q.plainNotes)+'</textarea>'+
  '</div>';
}

function renderItemCard(it, idx, totalCount){
  migrateItemWidths(it);
  var total = (Number(it.qty)||0)*(Number(it.price)||0);
  var widthsHtml = it.widths.map(function(w, wi){
    return '<div class="widthrow">'+
      '<input data-id="'+it.id+'" data-widx="'+wi+'" value="'+esc(w)+'" placeholder="'+(it.widths.length>1?('寬度 '+(wi+1)+'（第 '+(wi+1)+' 片）'):'寬度')+'">'+
      (it.widths.length>1 ? '<button class="wdel" data-id="'+it.id+'" data-widx="'+wi+'">✕</button>' : '')+
    '</div>';
  }).join('');
  return '<div class="itemcard" data-id="'+it.id+'">'+
    '<span class="idx">品項 '+(idx+1)+'</span>'+
    '<div class="itemtools">'+
      '<button class="itool" data-act="up" data-id="'+it.id+'" title="上移"'+(idx===0?' disabled':'')+'>↑</button>'+
      '<button class="itool" data-act="down" data-id="'+it.id+'" title="下移"'+(idx===totalCount-1?' disabled':'')+'>↓</button>'+
      '<button class="itool" data-act="dup" data-id="'+it.id+'" title="複製">⧉</button>'+
      '<button class="itool danger" data-act="rmv" data-id="'+it.id+'" title="刪除">✕</button>'+
    '</div>'+
    '<div class="field" style="margin-top:8px;"><label>品名</label><input data-id="'+it.id+'" data-f="name" value="'+esc(it.name)+'" placeholder="例如：ITAI省水馬桶 龍捲噴射虹吸"></div>'+
    '<div class="field"><label>寬度 W <span class="cnt">(兩片、三片拉門可新增多組寬度)</span></label>'+
      '<div class="widthlist" data-id="'+it.id+'">'+widthsHtml+'</div>'+
      '<button class="linebtn addw" type="button" data-id="'+it.id+'">＋ 新增寬度</button>'+
    '</div>'+
    '<div class="row3">'+
      '<div class="field"><label>高 H</label><input data-id="'+it.id+'" data-f="specH" value="'+esc(it.specH)+'"></div>'+
      '<div class="field"><label>深 D</label><input data-id="'+it.id+'" data-f="specD" value="'+esc(it.specD)+'"></div>'+
      '<div class="field"><label>數量</label><input data-id="'+it.id+'" data-f="qty" type="number" inputmode="decimal" value="'+esc(it.qty)+'"></div>'+
    '</div>'+
    '<div class="row2">'+
      '<div class="field"><label>單價</label><input data-id="'+it.id+'" data-f="price" type="number" inputmode="decimal" value="'+esc(it.price)+'"></div>'+
      '<div class="field"><label>小計</label><input value="$'+money(total)+'" disabled style="color:var(--primary-dark);font-weight:700;background:#f2f6fb;"></div>'+
    '</div>'+
    '<div class="field"><label>備註</label><input data-id="'+it.id+'" data-f="note" value="'+esc(it.note)+'" placeholder="例如：含安裝"></div>'+
    '<div class="photo-row">'+
      (it.photo ? '<img class="photo-thumb" src="'+it.photo+'">' : '<div class="photo-placeholder">📷</div>')+
      '<label class="linebtn" style="cursor:pointer;">選擇產品照片<input type="file" accept="image/*" data-photo="'+it.id+'" style="display:none;"></label>'+
      (it.photo ? '<button class="linebtn" data-clearphoto="'+it.id+'" style="background:var(--danger-light);color:var(--danger);">移除照片</button>' : '')+
    '</div>'+
  '</div>';
}

function renderExtraCard(q){
  migrateExtra(q);
  var t = TYPES[q.type];
  var rows = (q.extraList||[]).map(function(e){ return extraRowHTML(e); }).join('');
  return '<div class="card"><h2>'+(t.key==='door'?'安裝加項':'拆除／清運')+' <span class="cnt">(勾選要顯示的項目，可另外手動新增)</span></h2>'+
    '<div id="extraWrap">'+rows+'</div>'+
    '<button class="addbtn" id="btnAddExtra" style="margin-top:8px;">＋ 手動新增項目</button>'+
  '</div>';
}
function extraRowHTML(e){
  var total = (Number(e.qty)||0)*(Number(e.price)||0);
  var nameField = e.custom
    ? '<input class="exname" data-exid="'+e.id+'" data-ef="name" value="'+esc(e.name)+'" placeholder="項目名稱">'
    : ('<div class="en">'+esc(e.name)+(e.note?('<small>'+esc(e.note)+'</small>'):'')+'</div>');
  return '<div class="extrarow2">'+
    '<div class="excheck"><input type="checkbox" data-exid="'+e.id+'" data-ef="enabled" '+(e.enabled?'checked':'')+'></div>'+
    '<div class="exbody">'+nameField+
      (e.enabled ?
        ('<div class="exfields">'+
          '<input data-exid="'+e.id+'" data-ef="qty" type="number" inputmode="decimal" value="'+esc(e.qty)+'" placeholder="數量">'+
          '<input data-exid="'+e.id+'" data-ef="price" type="number" inputmode="decimal" value="'+esc(e.price)+'" placeholder="單價">'+
          '<span class="ext">$'+money(total)+'</span>'+
          (e.custom ? '<button class="exdel" data-exid="'+e.id+'">✕</button>' : '')+
        '</div>')
        : '')+
    '</div>'+
  '</div>';
}

      var it = q.items.find(function(x){ return x.id===id; });
      if(!it) return;
      it[f] = (f==='qty'||f==='price') ? inp.value : inp.value;

      scheduleAutosave();
    };
  });
  v.querySelectorAll('#itemsWrap [data-act]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-id');
      var act = btn.getAttribute('data-act');
      var idx = q.items.findIndex(function(x){ return x.id===id; });
      if(idx<0) return;
      if(act==='rmv'){
        if(q.items.length<=1){ toast('至少需保留一個品項'); return; }
        q.items.splice(idx,1);
      } else if(act==='dup'){
        var copy = JSON.parse(JSON.stringify(q.items[idx]));
        copy.id = uid('it');
        q.items.splice(idx+1,0,copy);
      } else if(act==='up'){
        if(idx===0) return;
        var tmp = q.items[idx-1]; q.items[idx-1] = q.items[idx]; q.items[idx] = tmp;
      } else if(act==='down'){
        if(idx===q.items.length-1) return;
        var tmp2 = q.items[idx+1]; q.items[idx+1] = q.items[idx]; q.items[idx] = tmp2;
      } else { return; }
      scheduleAutosave();
      renderEditor(v);

  v.querySelectorAll('.addw').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-id');
      var it = q.items.find(function(x){ return x.id===id; });

      migrateItemWidths(it);
      it.widths.push('');
      scheduleAutosave();
      renderEditor(v);
      var inputs = v.querySelectorAll('.widthlist[data-id="'+id+'"] input');
      if(inputs.length) inputs[inputs.length-1].focus();
    };
  });
  v.querySelectorAll('.wdel').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-id'), wi = Number(btn.getAttribute('data-widx'));
      var it = q.items.find(function(x){ return x.id===id; });
      if(!it) return;
      migrateItemWidths(it);
      if(it.widths.length<=1) return;
      it.widths.splice(wi,1);
      scheduleAutosave();
      renderEditor(v);
    };
  });

  // photos
  v.querySelectorAll('input[data-photo]').forEach(function(inp){
    inp.onchange = function(){
      var id = inp.getAttribute('data-photo');
      var file = inp.files && inp.files[0];
      if(!file) return;
      resizeImageToDataURL(file, 640, 0.72, function(dataURL){
        var it = q.items.find(function(x){ return x.id===id; });
        if(it){ it.photo = dataURL; scheduleAutosave(); renderEditor(v); }
      });
    };
  });
  v.querySelectorAll('[data-clearphoto]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-clearphoto');
      var it = q.items.find(function(x){ return x.id===id; });
      if(it){ it.photo = null; scheduleAutosave(); renderEditor(v); }
    };

  // extra items

    cb.onchange = function(){
      var id = cb.getAttribute('data-exid');
      var e = (q.extraList||[]).find(function(x){ return x.id===id; });
      if(!e) return;
      e.enabled = cb.checked;
      scheduleAutosave();
      renderEditor(v);
    };

  v.querySelectorAll('#extraWrap input[data-exid]:not([type=checkbox])').forEach(function(inp){
    inp.oninput = function(){
      var id = inp.getAttribute('data-exid'), f = inp.getAttribute('data-ef');
      var e = (q.extraList||[]).find(function(x){ return x.id===id; });

  v.querySelectorAll('#extraWrap .exdel').forEach(function(btn){

      scheduleAutosave();
      renderEditor(v);
    };

  var btnAddExtra = v.querySelector('#btnAddExtra');
  if(btnAddExtra) btnAddExtra.onclick = function(){

/* ---------------- image resize ---------------- */
function resizeImageToDataURL(file, maxW, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ cb(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- signature pad ---------------- */
function initSignaturePad(v, existing){
  var canvas = v.querySelector('#sigCanvas');
  if(!canvas) return;
  var ratio = window.devicePixelRatio || 1;
  function resize(){
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1a1d23';
    if(existing){
      var img = new Image();
      img.onload = function(){ ctx.drawImage(img,0,0,rect.width,rect.height); };
      img.src = existing;
    }
  }
  resize();
  var drawing = false, last = null;
  var ctx = canvas.getContext('2d');
  function pos(e){
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx,y:cy};
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){
    if(!drawing) return;
    drawing = false;
    STATE.current.signature = canvas.toDataURL('image/png');
    scheduleAutosave();
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  window._sigPad = { clear:function(){ var r=canvas.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); } };
}

function buildPrintHTML(q){

    migrateItemWidths(it);

    var remark = (it.photo ? '<img class="thumb" src="'+it.photo+'">' : '') + (it.note ? '<div class="thumbnote">'+esc(it.note)+'</div>' : '');
    var wCell = it.widths.filter(function(w){ return (w||'')!==''; }).map(function(w){ return esc(w); }).join('×');

        '<td class="money">'+money(subtotal)+'</td>'+
        '<td class="remark">'+remark+'</td>'+
      '</tr>';
    }

      '<td class="name">'+esc(it.name||('品項 '+(idx+1)))+'</td>'+
      '<td class="num">'+wCell+'</td>'+
      '<td class="num">'+esc(it.specH||'')+'</td>'+
      '<td class="num">'+esc(it.specD||'')+'</td>'+
      '<td class="num">'+esc(it.qty)+'</td>'+
      '<td class="money">'+money(it.price)+'</td>'+
      '<td class="remark">'+remark+'</td>'+

  var sigImg = q.signature ? '<img class="sigimg" src="'+q.signature+'">' : '';

    '<tr class="grandrow"><td colspan="'+labelSpan+'">'+esc(t.totalLabel||'總　價')+'</td><td colspan="'+valueSpan+'">'+money(totals.grand)+'　　單位（台幣）</td></tr>'+
    '<tr class="spellrow"><td colspan="'+colCount+'">台幣　'+spellTWD(totals.grand)+'</td></tr>';

function exportPDF(q){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    toast('PDF 元件載入中，請稍後再試');
    return;
  }
  showLoad('正在產生 PDF…');
  var root = document.getElementById('printRoot');
  root.innerHTML = buildPrintHTML(q);
  var target = root.querySelector('.doc');
  setTimeout(function(){
    html2canvas(target, {scale:2, useCORS:true, backgroundColor:'#ffffff'}).then(function(canvas){
      try{
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF('p','mm','a4');
        var pageW = 210, pageH = 297;
        var imgW = pageW;
        var imgH = canvas.height * imgW / canvas.width;
        if(imgH <= pageH){
          pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, imgW, imgH);
        } else {
          var pxPerPage = Math.floor(canvas.width * pageH / imgW);
          var pageCanvas = document.createElement('canvas');
          pageCanvas.width = canvas.width;
          pageCanvas.height = pxPerPage;
          var pctx = pageCanvas.getContext('2d');
          var remaining = canvas.height;
          var offset = 0;
          var first = true;
          while(remaining > 0){
            var sliceH = Math.min(pxPerPage, remaining);
            pageCanvas.height = sliceH;
            pctx.clearRect(0,0,pageCanvas.width, sliceH);
            pctx.drawImage(canvas, 0, offset, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
            var sliceImgH = sliceH * imgW / canvas.width;
            if(!first) pdf.addPage();
            pdf.addImage(pageCanvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, imgW, sliceImgH);
            offset += sliceH;
            remaining -= sliceH;
            first = false;
          }
        }
        var name = (q.customer.company || q.customer.contact || '報價單').replace(/[\\/:*?"<>|]/g,'');
        var fname = name+'_'+TYPES[q.type].short+'_'+(q.date||todayISO())+'.pdf';
        var blob = pdf.output('blob');
        var url = URL.createObjectURL(blob);
        hideLoad();
        showPdfResult(url, fname);
      }catch(err){
        hideLoad();
        toast('PDF 產生失敗，請重試');
      }
    }).catch(function(){
      hideLoad();
      toast('PDF 產生失敗，請重試');
    });
  }, 60);
}

function showPdfResult(url, fname){
  var card = document.getElementById('pdfResultCard');
  card.innerHTML =
    '<h3>PDF 已產生</h3>'+
    '<p>請點下方按鈕開啟 PDF；iOS 請在瀏覽器打開後，點右上角分享圖示選擇「儲存至檔案」或「列印」。</p>'+
    '<a class="btn btn-primary" href="'+url+'" target="_blank" rel="noopener">📄 開啟 PDF</a>'+
    '<a class="btn btn-outline" href="'+url+'" download="'+esc(fname)+'">📥 下載 PDF</a>'+
    '<button class="btn" id="btnClosePdfResult" style="border:none;background:none;color:var(--muted);box-shadow:none;">關閉</button>';
  document.getElementById('pdfResultModal').classList.add('show');
  document.getElementById('btnClosePdfResult').onclick = function(){
    document.getElementById('pdfResultModal').classList.remove('show');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  };
}

/* ---------------- preview ---------------- */
function openPreview(q){
  var modal = document.getElementById('previewModal');
  var body = document.getElementById('previewBody');
  body.innerHTML = '<div id="previewOuter" style="position:relative;overflow:hidden;margin:0 auto;"><div id="previewInner" style="transform-origin:top left;position:absolute;top:0;left:0;"></div></div>';
  var inner = document.getElementById('previewInner');
  inner.innerHTML = buildPrintHTML(q);
  modal.classList.add('show');
  requestAnimationFrame(function(){
    var doc = inner.querySelector('.doc');
    if(!doc) return;
    var natW = doc.offsetWidth || 794;
    var natH = doc.offsetHeight || 1000;
    var availW = body.clientWidth;
    var scale = availW < natW ? (availW/natW) : 1;
    inner.style.transform = 'scale('+scale+')';
    var outer = document.getElementById('previewOuter');
    outer.style.width = Math.round(natW*scale)+'px';
    outer.style.height = Math.round(natH*scale)+'px';
  });
}
function closePreview(){
  document.getElementById('previewModal').classList.remove('show');
}

/* ---------------- calculator import ---------------- */
var calcLoaded = false;
function openCalcModal(){
  var modal = document.getElementById('calcModal');
  if(!calcLoaded){
    var raw = document.getElementById('calcTemplate').textContent;
    var html = raw.split(String.fromCharCode(60,92,47,115,99,114,105,112,116,62)).join('<'+'/script>');
    document.getElementById('calcFrame').srcdoc = html;
    calcLoaded = true;
  }
  modal.classList.add('show');
}
function closeCalcModal(){
  document.getElementById('calcModal').classList.remove('show');
}
window.addEventListener('message', function(e){
  var data = e && e.data;
  if(!data || data.type !== 'itai_add_items' || !Array.isArray(data.items) || !data.items.length) return;
  var q = STATE.current;
  if(!q) return;
  if(q.items.length===1){
    var only = q.items[0];
    var onlyW = (Array.isArray(only.widths)&&only.widths.length) ? only.widths[0] : only.specW;
    if(!only.name && !onlyW && !only.specH && !only.specD && !only.price && !only.note && !only.photo){
      q.items = [];
    }
  }
  data.items.forEach(function(it){
    q.items.push({
      id: uid('it'),
      name: it.name||'',
      widths: it.specW ? [String(it.specW)] : [''],
      specH: it.specH||'',
      specD: it.specD||'',
      qty: it.qty||1,
      price: it.price||0,
      note: it.note||'',
      photo: null
    });
  });
  if(!q.items.length) q.items.push(newItem());
  scheduleAutosave();
  if(STATE.view==='editor') renderEditor(document.getElementById('view'));
  toast('已新增 '+data.items.length+' 項品項到報價單');
});

/* ---------------- boot ---------------- */
function boot(){
  var pwaIcon = document.getElementById('pwaIconMain');
  if(pwaIcon) pwaIcon.href = LOGO_DATA_URI;
  document.getElementById('fab').onclick = function(){ goto('typepick'); };
  document.getElementById('btnClosePreview').onclick = closePreview;
  document.getElementById('btnPreviewBack').onclick = closePreview;
  document.getElementById('btnPreviewConfirm').onclick = function(){
    closePreview();
    if(STATE.current) exportPDF(STATE.current);
  };
  document.getElementById('btnCloseCalc').onclick = closeCalcModal;
  bindQaModal();
  bindArrowDownNav();

  var c = sbClient();
  if(!c){
    // Supabase 函式庫沒載入成功（例如離線）：直接顯示登入畫面並提示錯誤，避免整頁空白。
    STATE.authError = '無法連線到帳號系統，請確認網路連線後重新整理頁面。';
    render();
    return;
  }
  c.auth.getSession().then(function(r){
    var session = r && r.data && r.data.session;
    if(session){
      onAuthReady(session);
    } else {
      STATE.view = 'auth';
      render();
    }
  }).catch(function(){
    STATE.view = 'auth';
    render();
  });

  c.auth.onAuthStateChange(function(event, session){
    if(event==='SIGNED_OUT'){
      if(STATE.view!=='auth'){ STATE.session=null; STATE.current=null; STATE.quotes=[]; STATE.view='auth'; render(); }
      return;
    }
    if(session) STATE.session = session; // 保持 session 最新（例如 token 自動更新）
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    if(!STATE.session) return;
    syncFromCloud(function(){
      listQuotes(function(list){
        STATE.quotes = list;
        if(STATE.view==='home') render();
      });
    });
  });
}

// 電腦輸入時，按「向下鍵」跳到下一個欄位（依畫面上的欄位順序），不用滑鼠點選或按 Tab。
// 只在目前焦點是單行文字類 input 時觸發，避免影響 textarea 內的正常換行游標移動。
function bindArrowDownNav(){
  document.addEventListener('keydown', function(e){
    if(e.key!=='ArrowDown') return;
    var el = e.target;
    if(!el || el.tagName!=='INPUT') return;
    var type = (el.type||'text').toLowerCase();
    if(['checkbox','radio','button','file','submit','range','color'].indexOf(type)>-1) return;
    var view = document.getElementById('view');
    if(!view || !view.contains(el)) return;
    var focusables = Array.prototype.slice.call(view.querySelectorAll('input, textarea, select')).filter(function(x){
      return !x.disabled && x.offsetParent!==null;
    });
    var idx = focusables.indexOf(el);
    if(idx>-1 && idx<focusables.length-1){
      e.preventDefault();
      var next = focusables[idx+1];
      next.focus();
      if(next.tagName==='INPUT' && next.select) next.select();
    }
  });
}
boot();

})();
