<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;800;900&display=swap');
:root{
  --primary:#164a8a;
  --primary-dark:#0a1b38;
  --primary-light:#eaf1fb;
  --accent:#2f6fb0;
  --bg:#f3f5f8;
  --surface:#ffffff;
  --text:#161b26;
  --muted:#6b7280;
  --border:#e5e8ed;
  --danger:#c4453c;
  --danger-light:#fbeceb;
  --radius:14px;
  --radius-sm:9px;
  --shadow-sm:0 1px 2px rgba(10,27,56,.06);
  --shadow-md:0 4px 14px rgba(10,27,56,.10);
  --shadow-btn:0 2px 8px rgba(22,74,138,.28);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;}
.ico{display:block;flex-shrink:0;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Heiti TC",Segoe UI,Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
#app{
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  position:relative;
}
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(155deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;
  padding:calc(14px + var(--safe-top)) 16px 14px;
  display:flex; align-items:center; gap:10px;
  box-shadow:0 2px 10px rgba(10,27,56,.18);
}
.topbar .tb-btn{
  background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.14); color:#fff;
  width:34px;height:34px;border-radius:10px;font-size:18px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  cursor:pointer;
}
.topbar h1{font-size:17px; font-weight:700; margin:0; flex:1; line-height:1.3;}
.topbar .tb-sub{font-size:11px;opacity:.8;font-weight:400;margin-top:1px;}

main{flex:1; padding:14px 14px calc(90px + var(--safe-bottom)); }

.card{
  background:var(--surface);
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
}
.card h2{font-size:14px;margin:0 0 10px;color:var(--primary-dark);font-weight:700;}
.card h2 .cnt{color:var(--muted);font-weight:400;font-size:12px;}

.field{margin-bottom:10px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
.field input, .field textarea, .field select{
  width:100%; border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:9px 10px; font-size:15px; font-family:inherit; background:#fff; color:var(--text);
}
.field textarea{resize:vertical;min-height:64px;line-height:1.5;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.row4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px;}

.empty{
  text-align:center; padding:50px 20px; color:var(--muted);
}
.empty .big{font-size:42px;margin-bottom:10px;}
.empty p{font-size:14px;line-height:1.6;margin:4px 0;}

.qlist{display:flex;flex-direction:column;gap:10px;}
.qcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);

}
.qcard:active{background:var(--primary-light); transform:scale(.997);}
.qcard .icon{
  width:42px;height:42px;border-radius:11px;
  background:linear-gradient(155deg,var(--primary-light) 0%,#dce9f9 100%);

}
.qcard .info{flex:1;min-width:0;}
.qcard .info .t1{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qcard .info .t2{font-size:12px;color:var(--muted);margin-top:2px;}
.qcard .amt{text-align:right;flex-shrink:0;}
.qcard .amt .n{font-size:15px;font-weight:700;color:var(--primary-dark);}
.qcard .amt .d{font-size:11px;color:var(--muted);margin-top:2px;}

.fab{
  position:fixed; right:calc(50% - 260px + 18px); bottom:calc(84px + var(--safe-bottom));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(155deg,var(--accent) 0%,var(--primary-dark) 100%);color:#fff;
  border:none; font-size:26px; box-shadow:0 6px 18px rgba(10,27,56,.4);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:15;
}
@media (max-width:559px){ .fab{ right:18px; } }

.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  max-width:520px; margin:0 auto;
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; padding:6px 6px calc(6px + var(--safe-bottom));
}
.bottomnav button{
  flex:1; background:none; border:none; padding:6px 4px; display:flex;
  flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10.5px;
  cursor:pointer; font-family:inherit;
}
.bottomnav button .ic{font-size:20px;}
.bottomnav button.active{color:var(--primary);}

.typegrid{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
.typebtn{
  display:flex; align-items:center; gap:14px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:var(--radius); padding:16px;
  cursor:pointer; text-align:left; font-family:inherit; box-shadow:var(--shadow-sm);
}
.typebtn:active{border-color:var(--primary); background:var(--primary-light);}
.typebtn .ic{
  width:44px;height:44px;flex-shrink:0;border-radius:12px;color:var(--primary-dark);
  background:linear-gradient(155deg,var(--primary-light) 0%,#dce9f9 100%);
  display:flex;align-items:center;justify-content:center;
}
.typebtn .tt{font-size:15px;font-weight:700;}
.typebtn .ds{font-size:12px;color:var(--muted);margin-top:2px;}

.itemcard{
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; background:#fbfbfc;
  position:relative; box-shadow:var(--shadow-sm);
}
.itemcard .idx{
  position:absolute; top:-9px; left:10px; background:var(--primary); color:#fff;
  font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px;
}
.itemcard .rmv{
  position:absolute; top:8px; right:8px; background:var(--danger-light); color:var(--danger);
  border:none; width:26px;height:26px;border-radius:8px; font-size:14px; cursor:pointer;
}
.itemtools{position:absolute; top:8px; right:8px; display:flex; gap:6px;}
.itemtools .itool{
  background:var(--primary-light); color:var(--primary-dark); border:1px solid rgba(22,74,138,.12);
  width:26px;height:26px;border-radius:8px; font-size:13px; cursor:pointer; padding:0;
  display:flex;align-items:center;justify-content:center;
}
.itemtools .itool.danger{background:var(--danger-light); color:var(--danger);}
.itemtools .itool:disabled{opacity:.35; cursor:default;}
.widthlist{display:flex; flex-direction:column; gap:6px; margin-bottom:6px;}
.widthrow{display:flex; gap:6px; align-items:center;}
.widthrow input{flex:1; border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 10px; font-size:15px; font-family:inherit;}
.widthrow .wdel{flex-shrink:0; background:var(--danger-light); color:var(--danger); border:none; width:30px;height:30px;border-radius:8px; font-size:12px; cursor:pointer;}
.addw{width:100%; margin-top:2px;}
.photo-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
.photo-thumb{
  width:56px;height:56px;border-radius:9px;object-fit:cover;border:1px solid var(--border);
}
.photo-placeholder{
  width:56px;height:56px;border-radius:9px;border:1.5px dashed var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;flex-shrink:0;
}
.linebtn{
  background:var(--primary-light); color:var(--primary-dark); border:none;
  border-radius:var(--radius-sm); padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
}
.addbtn{
  width:100%; background:var(--primary-light); border:1.5px dashed var(--primary); color:var(--primary-dark);
  border-radius:var(--radius-sm); padding:11px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
}

.extrarow{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
.extrarow:last-child{border-bottom:none;}
.extrarow .en{flex:1.5; color:var(--text); line-height:1.3;}
.extrarow .en small{display:block; color:var(--muted); font-size:11px;}
.extrarow input{width:100%; border:1px solid var(--border); border-radius:8px; padding:6px 7px; font-size:13px; text-align:right; font-family:inherit;}
.extrarow .eq{flex:0.7;}
.extrarow .ep{flex:1;}
.extrarow .et{flex:1; text-align:right; font-weight:600; font-size:13px;}

.extrarow2{border-bottom:1px solid var(--border); padding:8px 0; display:flex; gap:8px;}
.extrarow2:last-child{border-bottom:none;}
.extrarow2 .excheck{flex-shrink:0; padding-top:2px;}
.extrarow2 .excheck input{width:18px;height:18px;accent-color:var(--primary);}
.extrarow2 .exbody{flex:1; min-width:0;}
.extrarow2 .en{font-size:13px; color:var(--text); line-height:1.3; padding-top:1px;}
.extrarow2 .en small{display:block; color:var(--muted); font-size:11px;}
.extrarow2 .exname{width:100%; border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:13px; font-family:inherit; margin-bottom:6px;}
.extrarow2 .exfields{display:flex; align-items:center; gap:8px; margin-top:6px;}
.extrarow2 .exfields input{flex:1; min-width:0; border:1px solid var(--border); border-radius:8px; padding:6px 7px; font-size:13px; text-align:right; font-family:inherit;}
.extrarow2 .exfields .ext{flex:1; text-align:right; font-weight:600; font-size:13px; white-space:nowrap;}
.extrarow2 .exfields .exdel{flex-shrink:0; background:var(--danger-light); color:var(--danger); border:none; width:26px;height:26px;border-radius:8px; font-size:12px; cursor:pointer;}

.totalbox{background:var(--primary-dark); color:#fff; border-radius:var(--radius); padding:14px 16px;}
.totalbox .tl{display:flex; justify-content:space-between; font-size:13px; padding:3px 0; opacity:.85;}
.totalbox .tl.main{font-size:16px; font-weight:800; opacity:1; padding-top:8px; margin-top:6px; border-top:1px solid rgba(255,255,255,.25);}

.termsbox textarea{min-height:100px; font-size:12.5px; line-height:1.7; white-space:pre-wrap;}
.termsitem{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border);}
.termsitem:last-child{border-bottom:none;}
.termsitem input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--primary);}
.termsitem input[type=text]{flex:1; border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:13px; font-family:inherit; color:var(--text);}
.termsitem input[type=text]:disabled{color:var(--muted); background:#f7f7f8;}
.termsitem .tdel{flex-shrink:0; background:var(--danger-light); color:var(--danger); border:none; width:26px;height:26px;border-radius:8px; font-size:13px; cursor:pointer;}
.termsactions{display:flex; gap:8px; margin-top:10px;}
.termsactions .linebtn{flex:1; text-align:center;}
.collapsible-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.collapsible-head .chev{color:var(--muted); font-size:13px; transition:transform .15s;}

.sigwrap{border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; background:#fff;}
.sigwrap canvas{width:100%; height:130px; display:block; touch-action:none;}
.sigfoot{display:flex; justify-content:space-between; align-items:center; padding:6px 10px; background:#fafafa; border-top:1px solid var(--border);}
.sigfoot span{font-size:11px;color:var(--muted);}

#calcModal{display:none;position:fixed;inset:0;z-index:500;background:#fff;flex-direction:column;}
#calcModal.show{display:flex;}
#calcModal .cm-top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-top)) 14px 10px;background:var(--primary);color:#fff;flex-shrink:0;}
#calcModal .cm-top button{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0;}
#calcModal .cm-top .cm-title{flex:1;font-size:15px;font-weight:700;}
#calcModal iframe{flex:1;border:none;width:100%;}

#previewModal{display:none;position:fixed;inset:0;z-index:500;background:#f0f0f2;flex-direction:column;}
#previewModal.show{display:flex;}
#previewModal .pm-top{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-top)) 14px 10px;background:var(--primary-dark);color:#fff;flex-shrink:0;}
#previewModal .pm-top button{background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0;}
#previewModal .pm-top .pm-title{flex:1;font-size:15px;font-weight:700;}
#previewModal .pm-body{flex:1;overflow:auto;padding:14px;}
#previewModal .pm-actions{display:flex;gap:10px;padding:10px 14px calc(10px + var(--safe-bottom));background:#fff;border-top:1px solid var(--border);flex-shrink:0;}

#pdfResultModal{display:none;position:fixed;inset:0;z-index:600;background:rgba(20,22,26,.6);align-items:center;justify-content:center;padding:20px;}
#pdfResultModal.show{display:flex;}
#pdfResultModal .pr-card{background:#fff;border-radius:var(--radius);padding:20px 18px;max-width:360px;width:100%;text-align:center;}
#pdfResultModal .pr-card h3{margin:0 0 8px;font-size:16px;color:var(--text);}
#pdfResultModal .pr-card p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.6;}
#pdfResultModal .pr-card a.btn, #pdfResultModal .pr-card button.btn{display:flex;text-decoration:none;margin-bottom:10px;}

#qaModal{display:none;position:fixed;inset:0;z-index:600;background:rgba(20,22,26,.6);align-items:center;justify-content:center;padding:20px;}
#qaModal.show{display:flex;}
#qaModal .pr-card{background:#fff;border-radius:var(--radius);padding:20px 18px;max-width:360px;width:100%;text-align:center;}

.qcard{position:relative;}
.qcard .more{
  flex-shrink:0; width:30px; height:30px; border-radius:8px; border:none;
  background:var(--bg); color:var(--muted); font-size:18px; font-weight:700;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.qcard .more:active{background:var(--primary-light); color:var(--primary);}

.actionbar{display:flex; gap:10px; margin-top:4px;}
.btn{
  flex:1; border:none; border-radius:var(--radius-sm); padding:13px; font-size:15px; font-weight:700;
  cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:6px;
}
.btn-primary{background:linear-gradient(155deg,var(--accent) 0%,var(--primary-dark) 100%); color:#fff; box-shadow:var(--shadow-btn);}
.btn-outline{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
.btn-danger{background:var(--danger-light); color:var(--danger);}
.btn:disabled{opacity:.5;}

.savehint{text-align:center; font-size:11.5px; color:var(--muted); margin:4px 0 12px;}

#toast{
  position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
  background:#1a1d23; color:#fff; padding:10px 18px; border-radius:24px; font-size:13.5px;
  opacity:0; pointer-events:none; transition:.25s; z-index:999; white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.loadmask{
  position:fixed; inset:0; background:rgba(20,22,26,.55); z-index:998;
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; flex-direction:column; gap:10px;
}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.sectionlabel{font-size:12px; color:var(--muted); margin:16px 4px 6px; font-weight:600;}
.badge{display:inline-block; font-size:11px; background:var(--primary-light); color:var(--primary-dark); padding:2px 8px; border-radius:7px; font-weight:600;}

/* ---- print/pdf source layout ---- */
#printRoot{position:fixed; left:-99999px; top:0; width:794px; background:#fff;}
.doc{width:794px; background:#fff; color:#000; font-family:"PingFang TC","Microsoft JhengHei",sans-serif; padding:20px 24px; font-size:12px;}
.doc .dhead{display:flex; align-items:center; gap:14px;}
.doc .logo{display:flex; align-items:center;}
.doc .logo img{height:52px; width:auto; display:block;}
.doc .headmain{flex:1; text-align:center;}
.doc .cname{font-family:"Noto Serif TC","PMingLiU","MingLiU","Songti TC",serif; font-size:21px; font-weight:800; color:#000; letter-spacing:2px;}
.doc .ctitle{font-family:"Noto Serif TC","PMingLiU","MingLiU","Songti TC",serif; font-size:17px; font-weight:800; margin-top:4px; letter-spacing:10px;}
.doc .daterow{text-align:right; font-size:12px; margin-top:4px; padding-right:4px;}
.doc .daterow b{margin-right:4px;}
table.dtab{width:100%; border-collapse:collapse; margin-top:6px;}
table.dtab td, table.dtab th{border:1px solid #000; padding:4px 6px; font-size:11.5px; vertical-align:middle;}
table.dtab.outer{border:2px solid #000;}
table.dtab th{font-weight:800; text-align:center;}
.doc .meta td{padding:4px 8px; font-weight:700;}
.doc .meta .lbl{width:16%; text-align:center; white-space:nowrap;}
.doc .meta .lbl2{width:12%; text-align:center; white-space:nowrap;}
.doc .meta .val{font-weight:400; text-align:left;}
table.items th{text-align:center; font-weight:800;}
table.items td.name{text-align:center; font-weight:700; color:#7a3b12;}
table.items td.num{text-align:center;}
table.items td.money{text-align:right; font-weight:700; color:#7a3b12; padding-right:10px;}
table.items td.remark{text-align:center;}
table.items tr.itemrow td{padding:10px 6px;}
table.items .thumb{max-width:120px;max-height:90px;object-fit:contain;}
table.items .thumbnote{font-size:9.5px;color:#1c5fa8;font-weight:700;margin-top:2px;}
.doc .extralabel{text-align:left; font-weight:700;}
.doc .grandrow td{font-weight:800; text-align:center; font-size:13px;}
.doc .spellrow td{text-align:center; font-weight:700; letter-spacing:3px; padding:6px;}
.doc .termsbox{border:2px solid #000; border-top:none; padding:6px 10px; font-size:10.5px; line-height:1.7;}
.doc .termsbox .tt{font-weight:800; font-size:11.5px; margin-bottom:2px;}
.doc .termsbox .tline{border-top:1px solid #ccc; padding:2px 0;}
.doc .termsbox .tline:first-of-type{border-top:none;}
table.sigtab{width:100%; border-collapse:collapse; border:2px solid #000; border-top:none;}
table.sigtab td{border-left:1px solid #000; padding:6px 8px; vertical-align:top; font-size:11px; text-align:center;}
table.sigtab td:first-child{border-left:none; text-align:left; line-height:1.8;}
table.sigtab .sigtitle{font-weight:800; font-size:11.5px; border-bottom:1px solid #000; padding-bottom:4px; margin-bottom:6px;}
table.sigtab .agentname{font-weight:800; font-size:13px; margin-bottom:2px;}
.doc .sigimg{height:56px; object-fit:contain;}
.doc .validline{border:2px solid #000; border-top:none; padding:5px 10px; font-weight:800; font-size:11.5px;}
.doc .pageno{text-align:right; font-size:9px; color:#999; margin-top:6px;}

.authwrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px calc(24px + var(--safe-bottom));}
.authcard{width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px 22px;}
.authcard .logo{font-size:34px; text-align:center; margin-bottom:4px;}
.authcard h1{font-size:18px; text-align:center; margin:0 0 2px; color:var(--primary-dark);}
.authcard .sub{font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:18px;}
.authcard .field{margin-bottom:12px;}
.authcard .err{background:var(--danger-light); color:var(--danger); font-size:12.5px; border-radius:var(--radius-sm); padding:9px 11px; margin-bottom:12px; line-height:1.5;}
.authcard .primarybtn{width:100%; background:var(--primary); color:#fff; border:none; border-radius:var(--radius-sm); padding:12px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit;}
.authcard .primarybtn:disabled{opacity:.6;}
.authcard .switchrow{text-align:center; margin-top:16px; font-size:13px; color:var(--muted);}
.authcard .switchrow button{background:none; border:none; color:var(--primary); font-weight:700; font-size:13px; cursor:pointer; font-family:inherit; padding:0 2px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <main id="view"></main>
  <button class="fab" id="fab" title="新增報價單">＋</button>
  <div class="bottomnav" id="bottomnav"></div>
</div>
<div id="toast"></div>
<div id="printRoot"></div>

<div id="calcModal">
  <div class="cm-top">
    <button id="btnCloseCalc">←</button>
    <div class="cm-title">用試算表新增品項</div>
  </div>
  <iframe id="calcFrame"></iframe>
</div>

<div id="previewModal">
  <div class="pm-top">
    <button id="btnClosePreview">←</button>
    <div class="pm-title">預覽報價單</div>
  </div>
  <div class="pm-body" id="previewBody"></div>
  <div class="pm-actions">
    <button class="btn btn-outline" id="btnPreviewBack">返回編輯</button>
    <button class="btn btn-primary" id="btnPreviewConfirm">確認，匯出 PDF</button>
  </div>
</div>

<div id="pdfResultModal">
  <div class="pr-card" id="pdfResultCard"></div>
</div>

<div id="qaModal">
  <div class="pr-card">
    <h3 style="margin:0 0 12px;font-size:16px;color:var(--text);">編輯報價單</h3>
    <div class="field" style="margin-bottom:14px;text-align:left;">
      <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px;">報價單名稱</label>
      <input type="text" id="qaNameInput" placeholder="例：王小姐 淋浴拉門" style="width:100%;border:1px solid var(--border);border-radius:9px;padding:9px 10px;font-size:15px;font-family:inherit;">
    </div>
    <button class="btn btn-primary" id="qaSaveBtn" style="display:flex;margin-bottom:10px;">儲存名稱</button>
    <button class="btn" id="qaDupBtn" style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;background:var(--primary-light);color:var(--primary-dark);border:1.5px solid var(--primary);">複製此報價單</button>
    <button class="btn" id="qaDeleteBtn" style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;background:var(--danger-light);color:var(--danger);border:1.5px solid var(--danger);">刪除此報價單</button>
    <button class="btn" id="qaCancelBtn" style="display:flex;background:none;color:var(--muted);border:none;box-shadow:none;">取消</button>
  </div>
</div>

<script type="text/plain" id="calcTemplate"><!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>一太淋浴拉門｜報價計算器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap');
  :root {
    --navy:#1a2744;--gold:#c9a84c;--gold-light:#e8c97a;
    --cream:#faf8f3;--cream-dark:#f0ece0;--text:#2c2c2c;--text-muted:#7a7a7a;
    --white:#fff;--border:#d8d0bc;--success:#1e7e34;
    --shadow:0 4px 24px rgba(26,39,68,.12);--shadow-sm:0 2px 8px rgba(26,39,68,.08);

  *{box-sizing:border-box;margin:0;padding:0}

  .header-sub{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:3px}
  /* container */
  .container{max-width:560px;margin:0 auto;padding:14px 12px 110px}
  /* section */
  .section{background:var(--white);border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);overflow:hidden}
  .section-header{background:var(--navy);color:white;padding:10px 16px;display:flex;align-items:center;gap:8px}
  .section-num{background:var(--gold);color:var(--navy);width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
  .section-title{font-size:13.5px;font-weight:500;letter-spacing:.5px}
  .section-body{padding:13px 16px}
  /* product cards */
  .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .product-card{border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .15s;overflow:hidden;background:var(--cream)}
  .product-card:active{transform:scale(.97)}
  .product-card.selected{border-color:var(--gold);background:#fffbf0;box-shadow:0 0 0 1px var(--gold)}
  .product-card img{display:none}
  .pc-body{padding:10px 10px 10px}
  .pc-name{font-size:11px;font-weight:500;color:var(--navy);line-height:1.35;margin-bottom:3px}
  .pc-price{font-size:10.5px;color:var(--text-muted)}
  .pc-badge{font-size:9.5px;padding:1px 5px;border-radius:3px;margin-top:3px;display:inline-block}
  .b-inc{background:#e3f5e3;color:var(--success)}
  .b-ext{background:#fef3e2;color:#b86e00}
  .edit-hint{font-size:10.5px;color:var(--gold);text-align:right;margin-bottom:7px}
  /* step selectors */
  .step-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .step-row:last-child{margin-bottom:0}
  .step-chip{padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--cream);cursor:pointer;color:var(--navy);font-family:inherit;transition:all .15s;white-space:nowrap}
  .step-chip.sel{background:var(--navy);border-color:var(--navy);color:white}
  .step-chip:active{opacity:.8}
  .step-label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
  .spec-summary{background:var(--cream-dark);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--navy);margin-top:2px;line-height:1.6}
  .spec-summary span{color:var(--text-muted);font-size:11.5px}
  .product-note{font-size:11px;color:var(--text-muted);margin-top:8px;padding:7px 10px;background:var(--cream-dark);border-radius:6px;line-height:1.6}
  /* form */
  label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:5px}
  .form-group{margin-bottom:13px}
  .form-group:last-child{margin-bottom:0}
  input[type=number],select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;background:var(--cream);color:var(--text);appearance:none;-webkit-appearance:none;outline:none;transition:border-color .2s}
  input[type=number]:focus,select:focus{border-color:var(--gold)}
  /* height display */
  .height-display{background:var(--cream-dark);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:15px;color:var(--navy);font-weight:500}
  .height-display.pending{color:var(--text-muted);font-weight:400;font-size:13px}
  /* toggle */
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cream-dark)}
  .toggle-row:last-child{border-bottom:none}
  .tl{flex:1}
  .tl-main{font-size:14px;font-weight:500;color:var(--navy)}
  .tl-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px}
  .switch{position:relative;width:46px;height:26px;flex-shrink:0;margin-left:12px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:var(--border);border-radius:13px;transition:.25s;cursor:pointer}
  .slider::before{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;background:white;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .switch input:checked+.slider{background:var(--gold)}
  .switch input:checked+.slider::before{transform:translateX(20px)}
  /* threshold info box */
  .threshold-info{background:#f0f7e8;border-left:3px solid var(--success);padding:9px 12px;border-radius:0 7px 7px 0;margin-top:10px;font-size:12.5px;color:#1a5c1a;line-height:1.6}

  .preset-btn.active{background:var(--navy);border-color:var(--navy);color:white}
  /* summary */
  .price-summary{background:var(--navy);border-radius:12px;padding:17px 16px;color:white;margin-bottom:11px;box-shadow:var(--shadow)}
  .price-title{font-family:'Noto Serif TC',serif;font-size:12px;color:rgba(255,255,255,.55);letter-spacing:2.5px;margin-bottom:13px;text-align:center}
  .price-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.07)}
  .price-row:last-of-type{border-bottom:none}
  .price-row.disc{color:var(--gold-light)}
  .price-row.nd{color:rgba(255,255,255,.55);font-size:12px}
  .price-row span:last-child{font-weight:500}
  .price-total-row{margin-top:11px;padding-top:11px;border-top:1px solid rgba(201,168,76,.4);display:flex;justify-content:space-between;align-items:center}
  .price-total-label{font-family:'Noto Serif TC',serif;font-size:14px;color:var(--gold);letter-spacing:1px}
  .price-total-amount{font-size:26px;font-weight:700;color:var(--gold-light)}
  .price-empty{text-align:center;color:rgba(255,255,255,.3);font-size:13px;padding:10px 0}
  /* copy */
  .btn-copy{width:100%;background:var(--gold);color:var(--navy);border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 16px rgba(201,168,76,.4);transition:all .15s}
  .btn-copy:active{transform:scale(.98)}
  .notes-box{background:var(--cream-dark);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--text-muted);line-height:1.7;margin-top:10px}
  /* sidebar product nav */
  .other-nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px;padding:0 2px}
  .onav-btn{flex:1;min-width:70px;padding:8px 6px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-family:inherit;background:var(--cream);color:var(--navy);cursor:pointer;text-align:center;transition:all .15s;font-weight:500}
  .onav-btn.active{background:var(--navy);border-color:var(--navy);color:white;box-shadow:0 2px 8px rgba(26,39,68,.25)}
  .onav-btn:active{opacity:.8}
  .cat-header{grid-column:1/-1;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:1.5px;padding:8px 2px 3px;border-bottom:1px solid var(--border);margin-top:4px;text-transform:uppercase}
  .cat-header:first-child{margin-top:0}
  .other-panel{display:none}
  .other-panel.visible{display:block}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}

  .modal{background:white;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 16px 36px;max-height:88vh;overflow-y:auto}

  .mf{margin-bottom:12px}

  .btn-save{width:100%;background:var(--navy);color:white;border:none;border-radius:8px;padding:12px;font-size:14px;font-family:inherit;cursor:pointer;margin-top:6px}
</style>

// 使用者覆蓋設定
let overrides = {};
let selectedId = null;
// 每個 step 目前選到的 index
let stepSel = [];

function loadData(){ try{ const s=localStorage.getItem('itai_ov2'); if(s) overrides=JSON.parse(s); }catch(e){} }
function saveData(){ try{ localStorage.setItem('itai_ov2',JSON.stringify(overrides)); }catch(e){} }
function fmt(n){ return '$'+Math.round(n).toLocaleString('zh-TW'); }
// 產生「含X、Y、Z」形式的備註文字（不顯示金額），discNote 為折扣文字（如 "9折"），feats 為已勾選項目的描述陣列
function featureNote(discNote, feats){
  var parts=[];
  if(feats && feats.length) parts.push('含'+feats.join('、'));
  if(discNote) parts.push(discNote);
  return parts.join('，');
}

function getP(id){ return PRODUCTS.find(p=>p.id===id); }
function getM(id){
  const p=getP(id); const o=overrides[id]||{};
  return {...p, installType:o.installType||p.installType, installFee:o.installFee!=null?o.installFee:p.installFee, surveyFee:o.surveyFee!=null?o.surveyFee:p.surveyFee};
}

// ── 渲染產品卡片 ─────────────────────────────────
function renderCards(){
  const grid=document.getElementById('productGrid');
  grid.innerHTML='';
  let lastCat='';
  PRODUCTS.forEach(p=>{
    const m=getM(p.id);
    const cat=p.category||'';
    if(cat!==lastCat){
      const hdr=document.createElement('div');
      hdr.className='cat-header';
      hdr.textContent=cat;
      grid.appendChild(hdr);
      lastCat=cat;
    }
    const card=document.createElement('div');
    card.className='product-card'+(selectedId===p.id?' selected':'');
    const iText=m.installType==='included'?'✓ 安裝含牌價':`＋安裝 ${fmt(m.installFee)}`;
    const iCls=m.installType==='included'?'b-inc':'b-ext';
    const [line1,line2]=p.name.split('\n');
    card.innerHTML=`<img src="${p.img}" alt="" onerror="this.style.background='#ddd'">
      <div class="pc-body">
        <div class="pc-name"><span style="font-size:9.5px;color:var(--text-muted)">${line1||''}</span><br>${line2||''}</div>
        <div class="pc-price">${fmt(p.priceTable[0][0][0].price)}～</div>
        <div class="pc-badge ${iCls}">${iText}</div>
      </div>`;
    card.addEventListener('click',()=>selectProduct(p.id));
    let pt;
    const sp=()=>{pt=setTimeout(()=>openModal(p.id),650)};
    const ep=()=>clearTimeout(pt);
    card.addEventListener('touchstart',sp,{passive:true});
    card.addEventListener('touchend',ep);
    card.addEventListener('mousedown',sp);
    card.addEventListener('mouseup',ep);
    card.addEventListener('mouseleave',ep);
    grid.appendChild(card);
  });
}

// ── 選擇款式 ──────────────────────────────────────
function selectProduct(id){
  selectedId=id;
  stepSel=[];
  // 換款式時重置門檻
  const tt=document.getElementById('thresholdToggle');
  if(tt){ tt.checked=false; }
  const det=document.getElementById('thresholdDetail');
  if(det){ det.style.display='none'; }
  renderCards();
  renderSpec();
  showSections();
  calculate();
}

// ── 渲染規格選單（步驟式chip） ─────────────────────
function renderSpec(){
  const sec=document.getElementById('specSection');
  const body=document.getElementById('specBody');
  if(!selectedId){ sec.style.display='none'; return; }
  const p=getP(selectedId);
  sec.style.display='block';
  let html='';

  p.steps.forEach((step,si)=>{
    if(si>0 && stepSel[si-1]==null) return;

    html+=`<div class="step-label">${step.label}</div><div class="step-row">`;

    if(p.id==='h5248' && si===1){
      // 5248 型式：依材質動態
      const opts=(stepSel[0]!=null&&p.typeOptions)?p.typeOptions[stepSel[0]]:[];
      opts.forEach((opt,li)=>{ const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${opt.label}</button>`; });
    } else if(p.id==='h5248' && si===2){
      // 5248 寬度：依材質+型式動態
      const labels=getSizeLabels(p);
      labels.forEach((lbl,li)=>{ const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${lbl}</button>`; });
    } else if(p.id==='h5248' && si===3){
      // 5248 緩衝：依材質+型式動態
      const opts=(stepSel[0]!=null&&stepSel[1]!=null&&p.bufOptions)?p.bufOptions[stepSel[0]][stepSel[1]]:[];
      opts.forEach((opt,li)=>{ const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${opt.label}</button>`; });
    } else if(p.id==='h5248b' && si===1){
      // 5248B 寬度：依型式動態
      const labels=getSizeLabels(p);
      labels.forEach((lbl,li)=>{ const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${lbl}</button>`; });
    } else if(p.id==='h5248b' && si===2){
      // 5248B 緩衝：依型式動態
      const opts=(stepSel[0]!=null&&p.bufOptions)?p.bufOptions[stepSel[0]]:[];
      opts.forEach((opt,li)=>{ const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${opt.label}</button>`; });
    } else if(p.heightSteps && si===p.steps.length-2){
      // 高度段步驟（倒數第二步）：動態產生
      const hOpts=getHeightStepOptions(p);
      hOpts.forEach((opt,li)=>{
        const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${opt.label}</button>`;
      });
    } else if(si===p.steps.length-1){
      // 最後一步（寬度）：動態產生
      const labels=getSizeLabels(p);
      labels.forEach((lbl,li)=>{
        const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${lbl}</button>`;
      });
    } else {
      step.options.forEach((opt,li)=>{
        const sel=stepSel[si]===li;
        html+=`<button class="step-chip${sel?' sel':''}" onclick="selectStep(${si},${li})">${opt.label}</button>`;
      });
    }
    html+='</div>';
  });

  const result=getCurrentPriceItem();
  if(result){
    html+=`<div class="spec-summary">高度：<strong>${result.height} cm</strong> <span>（依規格自動帶入）</span></div>`;
  }
  if(p.note){
    html+=`<div class="product-note">${p.note}</div>`;
  }
  body.innerHTML=html;
}

// 取得高度段選項（針對 heightSteps 結構）
function getHeightStepOptions(p){
  if(!p.heightSteps) return [];
  // j2001: heightSteps[型式idx]
  // j4000: heightSteps[材質idx]
  if(p.id==='j2001'){
    const typeIdx=stepSel[1]; // 型式是第2步
    if(typeIdx==null) return [];
    return p.heightSteps[typeIdx]||[];
  }
  if(p.id==='j4000'){
    const matIdx=stepSel[1]; // 材質是第2步（第1步為顏色）
    if(matIdx==null) return [];
    return p.heightSteps[matIdx]||[];
  }
  return [];
}

// 取得目前是否為「一字型」門檻（isLinear）
function isCurrentThresholdLinear(){
  if(!selectedId) return false;
  const p=getP(selectedId);
  if(!p.heightSteps){
    // 沒有 heightSteps 的款式，用 thresholdType
    return p.thresholdType==='linear';
  }
  // 有 heightSteps 的款式，依所選的高度段的 isLinear
  const hOpts=getHeightStepOptions(p);
  const hIdx=stepSel[p.steps.length-2]; // 高度段是倒數第二步
  if(hIdx==null) return false;
  return hOpts[hIdx]?.isLinear || false;
}

function getSizeLabels(p){
  // 特殊款式優先判斷（避免被通用邏輯誤判）
  if(p.id==='h5248'){
    // sizeLabels[材質][型式] — 寬度是步驟2
    const matIdx=stepSel[0]; const typeIdx=stepSel[1];
    if(matIdx==null||typeIdx==null) return [];
    return p.sizeLabels[matIdx]?.[typeIdx]||[];
  }
  if(p.id==='h5248b'){
    // sizeLabels[型式] — 寬度是步驟1
    const typeIdx=stepSel[0];
    if(typeIdx==null) return [];
    return p.sizeLabels[typeIdx]||[];
  }
  if(!p.heightSteps){
    // 舊結構（無 heightSteps）
    if(p.steps.length===1) return p.sizeLabels[0];
    if(p.steps.length===2) return p.sizeLabels[stepSel[0]]||p.sizeLabels[0];
    if(p.steps.length===3){
      return p.sizeLabels[stepSel[1]]||p.sizeLabels[0];
    }
    return p.sizeLabels[0];
  }
  // 新結構（j2001/j4000）
  if(p.id==='j2001'){
    const typeIdx=stepSel[1]; const hIdx=stepSel[2];
    if(typeIdx==null||hIdx==null) return [];
    return p.sizeLabels[typeIdx]?.[hIdx]||[];
  }
  if(p.id==='j4000'){
    const hIdx=stepSel[2]; // 高度段是第3步（第1步為顏色）
    if(hIdx==null) return [];
    return p.sizeLabels[hIdx]||[];
  }
  return p.sizeLabels[0];
}

function selectStep(si, li){
  stepSel[si]=li;
  for(let i=si+1;i<10;i++) stepSel[i]=undefined;
  // 如果下一步是高度段且只有一個選項，自動選擇
  const p=getP(selectedId);
  if(p&&p.heightSteps && si+1===p.steps.length-2){
    const hOpts=getHeightStepOptions(p);
    if(hOpts.length===1){
      stepSel[si+1]=0;
    }
  }
  renderSpec();
  updateHeight();
  if(document.getElementById('thresholdToggle').checked){
    onThresholdToggle();
  }
  calculate();
}

// ── 取得目前選中的 price item ─────────────────────
function getCurrentPriceItem(){
  if(!selectedId) return null;
  const p=getP(selectedId);
  const n=p.steps.length;
  for(let i=0;i<n;i++){ if(stepSel[i]==null) return null; }
  try{
    if(p.id==='j2001'){
      // [材質][型式][高度段][寬度]
      return p.priceTable[stepSel[0]][stepSel[1]][stepSel[2]][stepSel[3]];
    }
    if(p.id==='j4000'){
      // [顏色][材質][高度段][寬度] — 顏色(stepSel[0])不進priceTable
      return p.priceTable[stepSel[1]][stepSel[2]][stepSel[3]];
    }
    if(p.id==='h5248'){
      // [材質][型式][寬度][緩衝]
      const item=p.priceTable[stepSel[0]]?.[stepSel[1]]?.[stepSel[2]]?.[stepSel[3]];
      return item?{...item,height:p.height}:null;
    }
    if(p.id==='h5248b'){
      // [型式][寬度][緩衝]
      const item=p.priceTable[stepSel[0]]?.[stepSel[1]]?.[stepSel[2]];
      return item?{...item,height:p.height}:null;
    }
    if(n===1) return p.priceTable[0][0][stepSel[0]];
    if(n===2) return p.priceTable[stepSel[0]][0][stepSel[1]];
    if(n===3) return p.priceTable[stepSel[0]][stepSel[1]][stepSel[2]];
  }catch(e){ return null; }
  return null;
}

// ── 依目前選擇的型式取得門檻選項 ─────────────────────
function getThresholdOptions(){
  if(!selectedId) return null;
  const p=getP(selectedId);
  // 偵測目前選的「型式」
  const shape = getCurrentShape();
  if(shape==='arc'){
    // 圓弧型：YB-01
    return [
      {label:'90×90cm以內',price:1500+600},
      {label:'100×100cm以內',price:1900+600},
      {label:'117×117cm以內',price:2200+600},
    ];
  }
  if(shape==='L'){
    // L型：YB-03
    return [
      {label:'100×100cm以內',price:1500+600},
      {label:'120×120cm以內',price:1900+600},
    ];
  }
  if(shape==='pentagon'){
    // 五角型：YB-04
    return [
      {label:'90×90cm以內',price:1500+600},
      {label:'100×100cm以內',price:1800+600},
      {label:'120×120cm以內',price:2200+600},
    ];
  }
  // 一字型（linear）：依寬度自動判斷
  return null; // 使用原本 linear 邏輯
}

// 偵測目前選的型式形狀
function getCurrentShape(){
  if(!selectedId) return 'linear';
  const p=getP(selectedId);
  // 金龍6000 = 圓弧型
  if(p.id==='jinlong6000') return 'arc';
  // 偵測 steps 中選到的型式文字
  let typeLabel='';
  if(p.id==='h5248'){
    const matIdx=stepSel[0]; const typeIdx=stepSel[1];
    if(matIdx!=null && typeIdx!=null && p.typeOptions){
      typeLabel=p.typeOptions[matIdx]?.[typeIdx]?.label||'';
    }
  } else if(p.id==='h5248b'){
    const typeIdx=stepSel[0];
    if(typeIdx!=null) typeLabel=p.steps[0].options[typeIdx]?.label||'';
  } else {
    // 一般款式：找 steps 中的型式步驟
    p.steps.forEach((step,si)=>{
      if(step.label==='型式' && stepSel[si]!=null){
        typeLabel=step.options[stepSel[si]]?.label||'';
      }
    });
  }
  if(typeLabel.includes('五角')) return 'pentagon';
  if(typeLabel.includes('L型')) return 'L';
  if(typeLabel.includes('圓弧')) return 'arc';
  return 'linear';
}

function onThresholdToggle(){
  const on=document.getElementById('thresholdToggle').checked;
  const det=document.getElementById('thresholdDetail');
  if(!on){ det.style.display='none'; calculate(); return; }

  const thOpts=getThresholdOptions();
  const shape=getCurrentShape();

  if(thOpts===null){
    // 一字型：固定顯示 $1,800
    det.style.display='block';
    det.innerHTML=`<div class="threshold-info">
      門檻本身 $1,200 ＋ 安裝費 $600 ＝ <strong>合計 $1,800</strong>（不打折）<br>
      <span style="font-size:11px;color:#2d6a2d">依附表一，一字型 180cm 以內</span>
    </div>`;
  } else {
    // 有對應型式的門檻選項
    const shapeLabel = shape==='arc'?'圓弧型':shape==='L'?'L型':shape==='pentagon'?'五角型':'';
    let opts=thOpts.map((o,i)=>`<button class="step-chip" id="th-opt-${i}" onclick="selectThreshold(${i})" style="margin:3px 4px 3px 0">${o.label}　$${o.price.toLocaleString()}</button>`).join('');
    det.style.display='block';
    det.innerHTML=`<div style="padding:8px 0 4px">
      <div style="font-size:12px;color:#555;margin-bottom:6px">${shapeLabel}門檻（含安裝 $600，不打折）</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px">${opts}</div>
      <input type="hidden" id="thresholdPrice" value="0">
    </div>`;
  }
  calculate();
}

function selectThreshold(idx){
  const thOpts=getThresholdOptions();
  if(!thOpts) return;
  // 更新 hidden input
  document.getElementById('thresholdPrice').value=thOpts[idx].price;
  // 更新按鈕樣式
  thOpts.forEach((_,i)=>{
    const btn=document.getElementById('th-opt-'+i);
    if(btn) btn.classList.toggle('sel', i===idx);
  });
  calculate();
}

// ── 計算 ──────────────────────────────────────────
function calculate(){
  if(!selectedId) return;
  const p=getP(selectedId);
  const m=getM(selectedId);
  const item=getCurrentPriceItem();
  const discount=Math.min(100,Math.max(1,parseFloat(document.getElementById('discount').value)||100));
  const w=parseFloat(document.getElementById('width').value)||0;
  const filmOn=document.getElementById('filmToggle').checked;
  const thresholdOn=document.getElementById('thresholdToggle').checked;
  const rate=discount/100;

  // 高度
  const h=item?item.height:0;

  // 防爆貼膜
  const filmOptEl=document.getElementById('filmOptions');
  if(filmOptEl) filmOptEl.style.display=filmOn?'block':'none';
  const filmCai=(w>0&&h>0)?Math.ceil((w/100)*(h/100)*10.89):0;
  const filmPPc=getFilmPricePerCai();
  const filmCost=filmCai*filmPPc;
  document.getElementById('filmLabel').textContent=
    (w>0&&h>0)?`${(w/100).toFixed(2)}m×${(h/100).toFixed(2)}m×10.89=${filmCai}才×$${filmPPc} → ${fmt(filmCost)}`
    :'請先輸入寬度及選擇規格';

  const detEl=document.getElementById('priceDetails');
  if(!item){ detEl.innerHTML='<div class="price-empty">請選擇規格</div>'; return; }

  const p_sel=getP(selectedId);
  const colorMult=(p_sel&&p_sel.colorSurcharge&&stepSel[0]===1)?1.1:1;
  const basePrice=Math.round(item.price*colorMult);
  const discounted=basePrice*rate;
  let total=discounted;
  let rows='';

  rows+=`<div class="price-row disc"><span>牌價（×${discount}折）</span><span>${fmt(discounted)}</span></div>`;
  rows+=`<div class="price-row nd"><span>原牌價</span><span>${fmt(basePrice)}</span></div>`;

  if(m.installType==='included'){
    rows+=`<div class="price-row nd"><span>安裝費</span><span>✓ 含於牌價</span></div>`;
  } else {
    rows+=`<div class="price-row nd"><span>安裝費（不打折）</span><span>${fmt(m.installFee)}</span></div>`;
    total+=m.installFee;
  }

  if(m.surveyFee>0){
    rows+=`<div class="price-row nd"><span>丈量費（不打折）</span><span>${fmt(m.surveyFee)}</span></div>`;
    total+=m.surveyFee;
  }

  if(filmOn){
    if(filmCost>0){
      rows+=`<div class="price-row nd"><span>防爆貼膜 ${filmCai}才（不打折）</span><span>${fmt(filmCost)}</span></div>`;
      total+=filmCost;
    } else {
      rows+=`<div class="price-row nd"><span>防爆貼膜</span><span>請輸入寬度</span></div>`;
    }
  }

  const demolishDoorOn=document.getElementById('demolishDoorToggle')?.checked;
  const disposeDoorOn=document.getElementById('disposeDoorToggle')?.checked;
  if(demolishDoorOn){ rows+=`<div class="price-row nd"><span>拆除舊拉門（不打折）</span><span>${fmt(1500)}</span></div>`; total+=1500; }
  if(disposeDoorOn){ rows+=`<div class="price-row nd"><span>拉門運棄費（不打折）</span><span>${fmt(1500)}</span></div>`; total+=1500; }

  if(thresholdOn){
    const shape=getCurrentShape();
    if(shape==='linear'){
      // 一字型：依寬度自動判斷 180以內$1800 / 180-200cm$2000
      const linearCost=(w>0&&w<=180)?1800:2000;
      const linearLabel=(w>0&&w<=180)?'一字型 180cm以內':'一字型 180-200cm';
      rows+=`<div class="price-row nd"><span>門檻含安裝（不打折）${w>0?'　'+linearLabel:''}</span><span>${fmt(linearCost)}</span></div>`;
      total+=linearCost;
    } else {
      const tp=parseFloat(document.getElementById('thresholdPrice')?.value)||0;
      if(tp>0){
        const shapeLabel=shape==='arc'?'圓弧型':shape==='L'?'L型':shape==='pentagon'?'五角型':'';
        rows+=`<div class="price-row nd"><span>${shapeLabel}門檻含安裝（不打折）</span><span>${fmt(tp)}</span></div>`;
        total+=tp;
      } else {
        rows+=`<div class="price-row nd"><span>門檻含安裝</span><span>請選擇尺寸</span></div>`;
      }
    }
  }

  detEl.innerHTML=rows+`
    <div class="price-total-row">
      <div class="price-total-label">合計估價</div>
      <div class="price-total-amount">${fmt(total)}</div>
    </div>`;
}

// ── 複製報價單 ────────────────────────────────────
function copyQuote(){
  if(!selectedId){ alert('請先選擇款式'); return; }
  const p=getP(selectedId); const m=getM(selectedId);
  const item=getCurrentPriceItem();
  if(!item){ alert('請完成規格選擇'); return; }
  const discount=parseFloat(document.getElementById('discount').value)||100;
  const w=parseFloat(document.getElementById('width').value)||0;
  const filmOn=document.getElementById('filmToggle').checked;
  const thresholdOn=document.getElementById('thresholdToggle').checked;
  const rate=discount/100;
  const h=item.height;
  const filmCai=(w>0&&h>0)?Math.ceil((w/100)*(h/100)*10.89):0;
  const filmCost=filmCai*getFilmPricePerCai();

  // 丈量費合入優惠價，不單獨顯示
  const surveyFeeC = m.surveyFee||0;
  const discPriceC = Math.round(item.price*rate) + surveyFeeC;
  let total = discPriceC;
  if(m.installType==='extra') total+=m.installFee;
  if(filmOn&&filmCost>0) total+=filmCost;
  let thresholdCost=0;
  if(thresholdOn){
    const shapeC=getCurrentShape();
    if(shapeC==='linear'){
      thresholdCost=(w>0&&w<=180)?1800:2000;
    } else {
      thresholdCost=parseFloat(document.getElementById('thresholdPrice')?.value)||0;
    }
    total+=thresholdCost;
  }

  const demolishDoorOn2=document.getElementById('demolishDoorToggle')?.checked;
  const disposeDoorOn2=document.getElementById('disposeDoorToggle')?.checked;
  if(demolishDoorOn2) total+=1500;
  if(disposeDoorOn2) total+=1500;
  let t=`【一太e衛浴 報價單】\n━━━━━━━━━━━━━━\n`;
  t+=`款式：${p.name.replace('\n',' ')}\n`;
  if(w) t+=`尺寸：${w} × ${h} cm\n`;
  t+=`━━━━━━━━━━━━━━\n`;
  t+=`優惠價格：${fmt(discPriceC)}\n`;
  if(m.installType==='included') t+=`安裝費：已含於牌價\n`;
  else if(m.installFee>0) t+=`安裝費：${fmt(m.installFee)}\n`;
  if(filmOn&&filmCost>0) t+=`防爆貼膜：${fmt(filmCost)}（${filmCai}才）\n`;
  if(thresholdOn&&thresholdCost>0) t+=`門檻含安裝：${fmt(thresholdCost)}\n`;
  if(demolishDoorOn2) t+=`拆除舊拉門：${fmt(1500)}\n`;
  if(disposeDoorOn2) t+=`拉門運棄費：${fmt(1500)}\n`;
  t+=`━━━━━━━━━━━━━━\n合計估價：${fmt(total)}\n`;
  t+=`※ 初步估算，實際以丈量為準\n📞 0800-042-111`;

  navigator.clipboard.writeText(t).then(()=>alert('✓ 報價單已複製')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=t;
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); alert('✓ 報價單已複製');
  });
}

function buildMiniSummary(rows,total){
  let h='<div style="background:var(--cream-dark);border-radius:8px;padding:8px 10px;font-size:12px">';
  rows.filter(Boolean).forEach(([label,val,cls])=>{
    h+=`<div style="display:flex;justify-content:space-between;padding:2px 0;color:${cls==='disc'?'var(--navy)':'var(--text-muted)'}"><span>${label}</span><span>${val}</span></div>`;
  });
  h+=`<div style="display:flex;justify-content:space-between;padding:4px 0 0;margin-top:4px;border-top:1px solid var(--border);font-weight:700;color:var(--navy)"><span>小計</span><span>${fmt(total)}</span></div>`;
  h+='</div>';
  return h;
}

// 依目前所選（顏色/材質/型式/緩衝…）取得規格描述文字陣列，供加入品項名稱使用。
// 「寬度」一律略過，因為寬度數值已另外記錄在 specW。
function getSelectedOptionsForStep(p, si){
  if(p.id==='h5248' && si===1){ return (stepSel[0]!=null&&p.typeOptions)?p.typeOptions[stepSel[0]]:[]; }
  if(p.id==='h5248' && si===3){ return (stepSel[0]!=null&&stepSel[1]!=null&&p.bufOptions)?p.bufOptions[stepSel[0]][stepSel[1]]:[]; }
  if(p.id==='h5248b' && si===2){ return (stepSel[0]!=null&&p.bufOptions)?p.bufOptions[stepSel[0]]:[]; }
  if(p.heightSteps && si===p.steps.length-2){ return getHeightStepOptions(p); }
  return p.steps[si].options;
}
function getSelectedSpecLabels(){
  if(!selectedId) return [];
  const p=getP(selectedId);
  const labels=[];
  p.steps.forEach((step,si)=>{
    if(stepSel[si]==null) return;
    if(step.label==='寬度') return;
    const opts=getSelectedOptionsForStep(p, si);
    const opt=opts&&opts[stepSel[si]];
    if(opt&&opt.label){
      const clean=opt.label.replace(/[（(].*?[）)]/g,'').trim();
      if(clean) labels.push(clean);
    }
  });
  return labels;
}

  }

  const fVal=document.getElementById('faucetModel').value;
  const fLP=fVal?parseFloat(fVal.replace('b',''))||0:0;
  const fDP=Math.round(fLP*oRate);
  const isShower=SHOWER_IDS.includes(fVal);
  const is500=INSTALL_500_IDS.includes(fVal);
  const fInstallFee2=is500?500:(isShower?2000:1100);
  const fInstall=document.getElementById('faucetInstall').checked?fInstallFee2:0;

function sendItemsToQuoteApp(includeOthers){
  const items=collectQuoteItems(includeOthers);
  if(!items.length){ alert('請先選擇並設定產品項目'); return; }
  window.parent.postMessage({type:'itai_add_items', items:items}, '*');
  const btn=document.getElementById(includeOthers?'addAllBtn':'addOneBtn');
  if(btn){
    const old=btn.textContent;
    btn.textContent='✓ 已加入 '+items.length+' 項';
    setTimeout(function(){ btn.textContent=old; },1400);
  }
}

// ── App Icon（Canvas）──────────────────────────────
function drawAppIcon(canvas, size) {
  const c = canvas;
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const r = size * 0.2;
  // rounded rect background
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size-r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size-r);
  ctx.quadraticCurveTo(size, size, size-r, size);
  ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size-r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#1e2f5a');
  grad.addColorStop(1, '#0f1a30');
  ctx.fillStyle = grad;
  ctx.fill();
  // gold border
  ctx.strokeStyle = 'rgba(201,168,76,0.6)';
  ctx.lineWidth = size * 0.025;
  ctx.stroke();
  // shower door frame
  const s = size * 0.14;
  ctx.strokeStyle = '#c9a84c';
  ctx.lineWidth = size * 0.055;
  ctx.lineCap = 'round';
  ctx.strokeRect(s, s, size - s*2, size - s*2 - size*0.12);
  // vertical divider
  const midX = size / 2;
  ctx.beginPath();
  ctx.moveTo(midX, s);
  ctx.lineTo(midX, size - s - size*0.12);
  ctx.stroke();
  // handle dots
  ctx.fillStyle = '#e8c97a';
  ctx.beginPath(); ctx.arc(midX - size*0.15, size/2, size*0.04, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(midX + size*0.15, size/2, size*0.04, 0, Math.PI*2); ctx.fill();
  // bottom text
  ctx.fillStyle = '#c9a84c';
  ctx.font = `bold ${size*0.14}px serif`;
  ctx.textAlign = 'center';
  ctx.fillText('一太', size/2, size - s*0.5);
}
// Draw header icon
try {
  const hc = document.getElementById('headerIcon');
  if(hc) drawAppIcon(hc, 32);
} catch(e) {}
// Generate 180px PNG for apple-touch-icon
try {
  const ic = document.createElement('canvas');
  drawAppIcon(ic, 180);
  const link = document.getElementById('pwaIcon');
  if(link) link.href = ic.toDataURL('image/png');
} catch(e) {}

// ── ArrowDown 跳下一欄（電腦輸入用）──────────────────
document.addEventListener('keydown', function(e){
  if(e.key!=='ArrowDown') return;
  var el = e.target;
  if(!el || el.tagName!=='INPUT') return;
  var type = (el.type||'text').toLowerCase();
  if(['checkbox','radio','button','file','submit','range','color'].indexOf(type)>-1) return;
  var focusables = Array.prototype.slice.call(document.querySelectorAll('input, textarea, select')).filter(function(x){
    return !x.disabled && x.offsetParent!==null;
  });
  var idx = focusables.indexOf(el);
  if(idx>-1 && idx<focusables.length-1){
    e.preventDefault();
    var next = focusables[idx+1];
    next.focus();
    if(next.tagName==='INPUT' && next.select) next.select();
  }
});

// ── INIT ──────────────────────────────────────────
loadData();
renderCards();
showSections();
<\/script>

// Spell out an integer amount using traditional Chinese financial numerals, e.g. 25800 -> 貳萬伍仟捌佰元整
function spellTWD(n){
  n = Math.round(Number(n)||0);
  if(n<=0) return '零元整';
  var digits = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];
  var smallUnits = ['','拾','佰','仟'];
  var bigUnits = ['','萬','億','兆'];
  var s = String(n);
  var groups = [];
  while(s.length>0){ groups.unshift(s.slice(-4)); s = s.slice(0,-4); }
  var out = '';
  for(var gi=0; gi<groups.length; gi++){
    var g = groups[gi];
    var gStr = '';
    var zeroPending = false;
    for(var i=0; i<g.length; i++){
      var d = parseInt(g[i],10);
      var unit = smallUnits[g.length-1-i];
      if(d===0){ zeroPending = (gStr!==''); }
      else {
        if(zeroPending){ gStr += '零'; zeroPending = false; }
        gStr += digits[d]+unit;
      }
    }
    if(gStr!==''){ out += gStr + bigUnits[groups.length-1-gi]; }
  }
  out = out.replace(/零+$/,'');
  return out + '元整';
}

function syncFromCloud(cb){

/* ---------------- storage ----------------
   本機用 localStorage 當作立即可用、離線也能用的快取；
   讀寫的同時會背景同步到 Supabase，讓手機、電腦等多裝置共用同一份資料。
   若偵測到舊版遺留在 window.storage（例如舊版連結）裡的資料，會在本機是空的情況下自動搬過來一次。
*/
// 本機快取依登入的使用者分開存放，避免同一台裝置給不同人登入時資料互相干擾。
function lsPrefix(){ return 'itaiQuote_' + (currentUserId() || 'anon') + '_'; }
function storageOK(){
  try{ var k='__itai_test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
function lsGet(key){
  return new Promise(function(resolve){
    try{
      var v = localStorage.getItem(lsPrefix()+key);
      resolve(v==null ? null : {key:key, value:v});
    }catch(e){ resolve(null); }
  });
}
function lsSet(key, value){
  return new Promise(function(resolve, reject){
    try{ localStorage.setItem(lsPrefix()+key, value); resolve({key:key, value:value}); }
    catch(e){ reject(e); }
  });
}
function lsDelete(key){
  return new Promise(function(resolve){
    try{ localStorage.removeItem(lsPrefix()+key); }catch(e){}
    resolve({key:key, deleted:true});
  });
}
function lsList(prefix){
  return new Promise(function(resolve){
    var keys = [];
    var p = lsPrefix();
    try{
      for(var i=0;i<localStorage.length;i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(p)===0){
          var real = k.slice(p.length);
          if(!prefix || real.indexOf(prefix)===0) keys.push(real);
        }
      }
    }catch(e){}
    resolve({keys:keys});
  });
}

// 若本機（localStorage）目前完全沒有資料，且瀏覽環境剛好提供了舊版用的 window.storage，
// 就嘗試把裡面的 settings 與所有 quote:* 資料搬進本機一次；之後一律只用本機儲存。
function migrateFromCloudStorage(cb){
  if(typeof window.storage === 'undefined' || !window.storage){ cb(); return; }
  lsList('').then(function(r){
    if(r && r.keys && r.keys.length){ cb(); return; }
    var tasks = [];
    window.storage.list('quote:').then(function(r2){
      var keys = (r2 && r2.keys) || [];
      keys.forEach(function(k){
        tasks.push(window.storage.get(k).then(function(res){
          if(res && res.value) return lsSet(k, res.value);
        }).catch(function(){}));
      });
      window.storage.get('settings').then(function(sres){
        if(sres && sres.value) tasks.push(lsSet('settings', sres.value));
        Promise.all(tasks).then(function(){ cb(); }).catch(function(){ cb(); });
      }).catch(function(){
        Promise.all(tasks).then(function(){ cb(); }).catch(function(){ cb(); });
      });
    }).catch(function(){ cb(); });
  }).catch(function(){ cb(); });
}

// 舊資料只有單一 specW 字串；新資料改用 widths 陣列以支援多片寬度（如兩片、三片拉門）。
// 呼叫後會確保 it.widths 是陣列並直接寫回物件，之後可直接操作 it.widths。
function migrateItemWidths(it){

function newExtraEntry(key,name,note,price,custom){
  return { id:uid('ex'), key:key||null, name:name||'', note:note||'', qty:0, price:price||0, enabled:false, custom:!!custom };
}
// 將舊資料（q.extra：以固定 key 記錄數量單價的物件）遷移為新的可勾選加項清單 q.extraList，
// 並保留原本已填寫（qty>0）的項目為「已勾選」狀態，避免舊報價單的資料消失。已是新結構則不動作。
function migrateExtra(q){
  if(q.extraList) return;
  var t = TYPES[q.type];
  var list = [];
  var old = q.extra || {};
  if(t.hasFilm){
    var f = old.film || {qty:0,price:0};
    var enF = (Number(f.qty)||0) > 0;
    list.push({ id:uid('ex'), key:'film', name:'加購玻璃防爆膜', note:'透明／霧面擇一，貼外側防自爆噴濺', qty:f.qty||0, price:(f.price!=null?Number(f.price):0), enabled:enF, custom:false });
  }
  t.extraFixed.forEach(function(e){
    var v = old[e.key] || {qty:0, price:e.price};
    var en = (Number(v.qty)||0) > 0;
    list.push({ id:uid('ex'), key:e.key, name:e.name, note:e.note, qty:v.qty||0, price:(v.price!=null?Number(v.price):e.price), enabled:en, custom:false });
  });
  q.extraList = list;
}

// 將舊資料（純字串 q.terms）遷移為新的可勾選備註結構；已是新結構則不動作。
function migrateTerms(q){
  if(q.termsItems) return;
  var t = TYPES[q.type];
  var lines = (q.terms||'').split('\n').filter(function(l){ return l.trim()!==''; });
  var numbered = [], plain = [];
  lines.forEach(function(l){
    var m = l.match(/^\s*\d+[.、]\s*(.*)$/);
    if(m){ numbered.push(m[1]); } else { plain.push(l); }
  });
  if(numbered.length){
    q.termsItems = numbered.map(function(txt){ return {id:uid('ti'), text:txt, enabled:true}; });
    q.plainNotes = plain.join('\n');
  } else {
    q.termsItems = (t&&t.defaultTermsList||[]).map(function(txt){ return {id:uid('ti'), text:txt, enabled:true}; });
    q.plainNotes = t?t.defaultPlainNote:'';
  }
}

// 依勾選狀態自動產生「N. 文字」的最終備註文字（未勾選者不編號、不顯示）
function computeTermsText(q){
  var lines = [], idx = 1;
  (q.termsItems||[]).forEach(function(it){
    var txt = (it.text||'').trim();
    if(it.enabled && txt!==''){ lines.push(idx+'. '+txt); idx++; }
  });
  (q.plainNotes||'').split('\n').forEach(function(l){
    if(l.trim()!=='') lines.push(l);
  });
  return lines.join('\n');
}

function calcTotals(q){
  migrateExtra(q);
  var t = TYPES[q.type];
  var itemsTotal = q.items.reduce(function(s,it){ return s + (Number(it.qty)||0)*(Number(it.price)||0); },0);
  var extraTotal = 0, filmTotal = 0;
  (q.extraList||[]).forEach(function(e){
    if(!e.enabled) return;
    var amt = (Number(e.qty)||0)*(Number(e.price)||0);
    if(e.key==='film') filmTotal += amt; else extraTotal += amt;
  });
  var grand = itemsTotal + extraTotal + filmTotal;
  var result = { itemsTotal:itemsTotal, extraTotal:extraTotal, filmTotal:filmTotal, grand:grand };
  if(t.showTax){
    result.untaxed = grand/1.05;
    result.tax = grand - result.untaxed;
  }
  return result;
}

/* ---------------- render: auth (登入／註冊) ---------------- */
function renderAuth(v){
  var signup = STATE.authMode==='signup';
  v.innerHTML =
    '<div class="authwrap"><div class="authcard">'+
      '<div class="logo"><img src="'+LOGO_DATA_URI+'" alt="毅太" width="64" height="64" style="border-radius:16px;"></div>'+
      '<h1>毅太行動報價單</h1>'+
      '<div class="sub">'+(signup?'建立您的帳號':'登入以繼續')+'</div>'+
      (STATE.authError ? '<div class="err">'+esc(STATE.authError)+'</div>' : '')+
      '<div class="field"><label>姓名</label><input id="auth_name" type="text" autocomplete="name" placeholder="例如：蔡恩霖"></div>'+
      '<div class="field"><label>密碼</label><input id="auth_password" type="password" autocomplete="'+(signup?'new-password':'current-password')+'" placeholder="至少 6 碼"></div>'+
      (signup ? '<div class="field"><label>確認密碼</label><input id="auth_password2" type="password" autocomplete="new-password"></div>' : '')+
      '<button class="primarybtn" id="auth_submit">'+(signup?'註冊':'登入')+'</button>'+
      '<div class="switchrow">'+
        (signup ? '已經有帳號了？<button id="auth_switch">登入</button>' : '還沒有帳號？<button id="auth_switch">註冊一個</button>')+
      '</div>'+
    '</div></div>';
  bindAuthEvents(v);
}
function bindAuthEvents(v){
  var submit = v.querySelector('#auth_submit');
  var switchBtn = v.querySelector('#auth_switch');
  switchBtn.onclick = function(){
    STATE.authMode = (STATE.authMode==='signup') ? 'signin' : 'signup';
    STATE.authError = '';
    render();
  };
  submit.onclick = function(){
    var name = (v.querySelector('#auth_name').value||'').trim();
    var pw = v.querySelector('#auth_password').value||'';
    if(!name || !pw){ STATE.authError = '請輸入姓名和密碼'; render(); return; }
    var c = sbClient();
    if(!c){ STATE.authError = '目前無法連線，請確認網路連線後重試'; render(); return; }
    var email = nameToEmail(name);
    if(STATE.authMode==='signup'){
      var pw2 = v.querySelector('#auth_password2').value||'';
      if(pw.length<6){ STATE.authError = '密碼至少需要 6 碼'; render(); return; }
      if(pw!==pw2){ STATE.authError = '兩次輸入的密碼不一致'; render(); return; }
      submit.disabled = true; submit.textContent='註冊中…';
      c.auth.signUp({ email:email, password:pw, options:{ data:{ display_name:name } } }).then(function(r){
        submit.disabled = false;
        if(r.error){ STATE.authError = r.error.message; render(); return; }
        if(r.data && r.data.session){
          onAuthReady(r.data.session);
        } else {
          STATE.authError = '這個姓名已經有帳號了，或系統要求信箱驗證（請確認 Supabase 後台已關閉 Confirm email）。';
          STATE.authMode = 'signin';
          render();
        }
      }).catch(function(){ submit.disabled=false; STATE.authError='註冊失敗，請稍後再試'; render(); });
    } else {
      submit.disabled = true; submit.textContent='登入中…';
      c.auth.signInWithPassword({ email:email, password:pw }).then(function(r){
        submit.disabled = false;
        if(r.error){ STATE.authError = '姓名或密碼不正確'; render(); return; }
        onAuthReady(r.data.session);
      }).catch(function(){ submit.disabled=false; STATE.authError='登入失敗，請稍後再試'; render(); });
    }
  };
}
// 登入／註冊成功後，載入這個帳號自己的資料並進入主畫面
function onAuthReady(session){
  STATE.session = session;
  STATE.authError = '';
  migrateFromCloudStorage(function(){
    syncFromCloud(function(){
      loadSettings(function(){
        listQuotes(function(list){
          STATE.quotes = list;
          STATE.view = 'home';
          render();
        });
      });
    });
  });
}
function signOut(){
  var c = sbClient();
  var after = function(){
    STATE.session = null;
    STATE.current = null;
    STATE.quotes = [];
    STATE.view = 'auth';
    STATE.authMode = 'signin';
    STATE.authError = '';
    render();
  };
  if(c) c.auth.signOut().then(after).catch(after);
  else after();
}

/* ---------------- home: rename / delete quote ---------------- */
var qaTargetId = null;
function openQaModal(id){
  var q = STATE.quotes.find(function(x){ return x.id===id; });
  if(!q) return;
  qaTargetId = id;
  document.getElementById('qaNameInput').value = q.title || '';
  document.getElementById('qaModal').classList.add('show');
}
function closeQaModal(){
  document.getElementById('qaModal').classList.remove('show');
  qaTargetId = null;
}
function bindQaModal(){
  document.getElementById('qaCancelBtn').onclick = closeQaModal;
  document.getElementById('qaModal').onclick = function(e){ if(e.target.id==='qaModal') closeQaModal(); };
  document.getElementById('qaSaveBtn').onclick = function(){
    if(!qaTargetId) return;
    var q = STATE.quotes.find(function(x){ return x.id===qaTargetId; });
    if(!q) return;
    q.title = document.getElementById('qaNameInput').value.trim();
    if(STATE.current && STATE.current.id===q.id) STATE.current.title = q.title;
    saveQuote(q, function(){
      closeQaModal();
      toast('已更新名稱');
      render();
    });
  };
  document.getElementById('qaDupBtn').onclick = function(){
    if(!qaTargetId) return;
    var q = STATE.quotes.find(function(x){ return x.id===qaTargetId; });
    if(!q) return;
    var copy = JSON.parse(JSON.stringify(q));
    copy.id = uid('q');
    copy.title = (q.title ? q.title+' ' : '') + '(複製)';
    copy.createdAt = Date.now();
    copy.updatedAt = Date.now();
    saveQuote(copy, function(){
      STATE.quotes.unshift(copy);
      closeQaModal();
      toast('已複製一份');
      render();
    });
  };
  document.getElementById('qaDeleteBtn').onclick = function(){
    if(!qaTargetId) return;
    if(!confirm('刪除這張報價單？此動作無法復原。')) return;
    var id = qaTargetId;
    deleteQuote(id, function(){
      STATE.quotes = STATE.quotes.filter(function(x){ return x.id!==id; });
      if(STATE.current && STATE.current.id===id) STATE.current = null;
      closeQaModal();
      toast('已刪除');
      render();
    });
  };
}

    inp.oninput = function(){
      var id = inp.getAttribute('data-id'), f = inp.getAttribute('data-f');

      it[f] = (f==='qty'||f==='price') ? inp.value : inp.value;

  });
  v.querySelectorAll('#itemsWrap [data-act]').forEach(function(btn){

      var id = btn.getAttribute('data-id');

      if(idx<0) return;
      if(act==='rmv'){
        if(q.items.length<=1){ toast('至少需保留一個品項'); return; }
        q.items.splice(idx,1);
      } else if(act==='dup'){
        var copy = JSON.parse(JSON.stringify(q.items[idx]));
        copy.id = uid('it');
        q.items.splice(idx+1,0,copy);
      } else if(act==='up'){
        if(idx===0) return;
        var tmp = q.items[idx-1]; q.items[idx-1] = q.items[idx]; q.items[idx] = tmp;
      } else if(act==='down'){
        if(idx===q.items.length-1) return;
        var tmp2 = q.items[idx+1]; q.items[idx+1] = q.items[idx]; q.items[idx] = tmp2;
      } else { return; }

    btn.onclick = function(){

  });
  v.querySelectorAll('.wdel').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-id'), wi = Number(btn.getAttribute('data-widx'));
      var it = q.items.find(function(x){ return x.id===id; });

      });
    };
  });
  v.querySelectorAll('[data-clearphoto]').forEach(function(btn){
    btn.onclick = function(){
      var id = btn.getAttribute('data-clearphoto');
      var it = q.items.find(function(x){ return x.id===id; });

    cb.onchange = function(){
      var id = cb.getAttribute('data-exid');
      var e = (q.extraList||[]).find(function(x){ return x.id===id; });
      if(!e) return;

      scheduleAutosave();

  v.querySelectorAll('#extraWrap input[data-exid]:not([type=checkbox])').forEach(function(inp){
    inp.oninput = function(){

      scheduleAutosave();
      renderEditor(v);
    };

  var btnAddExtra = v.querySelector('#btnAddExtra');
  if(btnAddExtra) btnAddExtra.onclick = function(){
    if(!q.extraList) q.extraList = [];

/* ---------------- image resize ---------------- */
function resizeImageToDataURL(file, maxW, quality, cb){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = function(){ cb(e.target.result); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- signature pad ---------------- */
function initSignaturePad(v, existing){
  var canvas = v.querySelector('#sigCanvas');
  if(!canvas) return;
  var ratio = window.devicePixelRatio || 1;
  function resize(){
    var rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    var ctx = canvas.getContext('2d');
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1a1d23';
    if(existing){
      var img = new Image();
      img.onload = function(){ ctx.drawImage(img,0,0,rect.width,rect.height); };
      img.src = existing;
    }
  }
  resize();
  var drawing = false, last = null;
  var ctx = canvas.getContext('2d');
  function pos(e){
    var rect = canvas.getBoundingClientRect();
    var cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    var cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x:cx,y:cy};
  }
  function start(e){ drawing = true; last = pos(e); e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    var p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; e.preventDefault();
  }
  function end(){
    if(!drawing) return;
    drawing = false;
    STATE.current.signature = canvas.toDataURL('image/png');
    scheduleAutosave();
  }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  window._sigPad = { clear:function(){ var r=canvas.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); } };
}

    '<div class="validline">本估價單有效期限至　'+esc(validUntil)+'</div>'+
  '</div>';
}
function extraPrintRow(isDoor, name, v, note){
  v = v || {qty:0,price:0};
  var qty = Number(v.qty)||0, price = Number(v.price)||0;
  if(isDoor){
    return '<tr><td class="extralabel">'+esc(name)+'</td><td colspan="2"></td><td class="num">'+esc(qty)+'</td><td class="money">'+money(price)+'</td><td class="money">'+money(qty*price)+'</td><td class="remark" style="font-size:10px;">'+esc(note||'')+'</td></tr>';
  }
  return '<tr><td class="extralabel">'+esc(name)+'</td><td colspan="3"></td><td class="num">'+esc(qty)+'</td><td class="money">'+money(price)+'</td><td class="remark" style="font-size:10px;">'+esc(note||'')+'</td></tr>';
}

function exportPDF(q){
  if(typeof html2canvas==='undefined' || typeof window.jspdf==='undefined'){
    toast('PDF 元件載入中，請稍後再試');
    return;
  }
  showLoad('正在產生 PDF…');
  var root = document.getElementById('printRoot');
  root.innerHTML = buildPrintHTML(q);
  var target = root.querySelector('.doc');
  setTimeout(function(){
    html2canvas(target, {scale:2, useCORS:true, backgroundColor:'#ffffff'}).then(function(canvas){
      try{
        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF('p','mm','a4');
        var pageW = 210, pageH = 297;
        var imgW = pageW;
        var imgH = canvas.height * imgW / canvas.width;
        if(imgH <= pageH){
          pdf.addImage(canvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, imgW, imgH);
        } else {
          var pxPerPage = Math.floor(canvas.width * pageH / imgW);
          var pageCanvas = document.createElement('canvas');
          pageCanvas.width = canvas.width;
          pageCanvas.height = pxPerPage;
          var pctx = pageCanvas.getContext('2d');
          var remaining = canvas.height;
          var offset = 0;
          var first = true;
          while(remaining > 0){
            var sliceH = Math.min(pxPerPage, remaining);
            pageCanvas.height = sliceH;
            pctx.clearRect(0,0,pageCanvas.width, sliceH);
            pctx.drawImage(canvas, 0, offset, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
            var sliceImgH = sliceH * imgW / canvas.width;
            if(!first) pdf.addPage();
            pdf.addImage(pageCanvas.toDataURL('image/jpeg',0.92), 'JPEG', 0, 0, imgW, sliceImgH);
            offset += sliceH;
            remaining -= sliceH;
            first = false;
          }
        }
        var name = (q.customer.company || q.customer.contact || '報價單').replace(/[\\/:*?"<>|]/g,'');
        var fname = name+'_'+TYPES[q.type].short+'_'+(q.date||todayISO())+'.pdf';
        var blob = pdf.output('blob');
        var url = URL.createObjectURL(blob);
        hideLoad();
        showPdfResult(url, fname);
      }catch(err){
        hideLoad();
        toast('PDF 產生失敗，請重試');
      }
    }).catch(function(){
      hideLoad();
      toast('PDF 產生失敗，請重試');
    });
  }, 60);
}

function showPdfResult(url, fname){
  var card = document.getElementById('pdfResultCard');
  card.innerHTML =
    '<h3>PDF 已產生</h3>'+
    '<p>請點下方按鈕開啟 PDF；iOS 請在瀏覽器打開後，點右上角分享圖示選擇「儲存至檔案」或「列印」。</p>'+
    '<a class="btn btn-primary" href="'+url+'" target="_blank" rel="noopener">'+ico('receipt',16)+' 開啟 PDF</a>'+
    '<a class="btn btn-outline" href="'+url+'" download="'+esc(fname)+'">📥 下載 PDF</a>'+
    '<button class="btn" id="btnClosePdfResult" style="border:none;background:none;color:var(--muted);box-shadow:none;">關閉</button>';
  document.getElementById('pdfResultModal').classList.add('show');
  document.getElementById('btnClosePdfResult').onclick = function(){
    document.getElementById('pdfResultModal').classList.remove('show');
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  };
}

/* ---------------- preview ---------------- */
function openPreview(q){
  var modal = document.getElementById('previewModal');
  var body = document.getElementById('previewBody');
  body.innerHTML = '<div id="previewOuter" style="position:relative;overflow:hidden;margin:0 auto;"><div id="previewInner" style="transform-origin:top left;position:absolute;top:0;left:0;"></div></div>';
  var inner = document.getElementById('previewInner');
  inner.innerHTML = buildPrintHTML(q);
  modal.classList.add('show');
  requestAnimationFrame(function(){
    var doc = inner.querySelector('.doc');
    if(!doc) return;
    var natW = doc.offsetWidth || 794;
    var natH = doc.offsetHeight || 1000;
    var availW = body.clientWidth;
    var scale = availW < natW ? (availW/natW) : 1;
    inner.style.transform = 'scale('+scale+')';
    var outer = document.getElementById('previewOuter');
    outer.style.width = Math.round(natW*scale)+'px';
    outer.style.height = Math.round(natH*scale)+'px';
  });
}
function closePreview(){
  document.getElementById('previewModal').classList.remove('show');
}

/* ---------------- calculator import ---------------- */
var calcLoaded = false;
function openCalcModal(){
  var modal = document.getElementById('calcModal');
  if(!calcLoaded){
    var raw = document.getElementById('calcTemplate').textContent;
    var html = raw.split(String.fromCharCode(60,92,47,115,99,114,105,112,116,62)).join('<'+'/script>');
    document.getElementById('calcFrame').srcdoc = html;
    calcLoaded = true;
  }
  modal.classList.add('show');
}
function closeCalcModal(){
  document.getElementById('calcModal').classList.remove('show');
}
window.addEventListener('message', function(e){
  var data = e && e.data;
  if(!data || data.type !== 'itai_add_items' || !Array.isArray(data.items) || !data.items.length) return;
  var q = STATE.current;
  if(!q) return;
  if(q.items.length===1){
    var only = q.items[0];
    var onlyW = (Array.isArray(only.widths)&&only.widths.length) ? only.widths[0] : only.specW;
    if(!only.name && !onlyW && !only.specH && !only.specD && !only.price && !only.note && !only.photo){
      q.items = [];
    }
  }
  data.items.forEach(function(it){
    q.items.push({
      id: uid('it'),
      name: it.name||'',
      widths: it.specW ? [String(it.specW)] : [''],
      specH: it.specH||'',
      specD: it.specD||'',
      qty: it.qty||1,
      price: it.price||0,
      note: it.note||'',
      photo: null
    });
  });
  if(!q.items.length) q.items.push(newItem());
  scheduleAutosave();
  if(STATE.view==='editor') renderEditor(document.getElementById('view'));
  toast('已新增 '+data.items.length+' 項品項到報價單');
});

/* ---------------- boot ---------------- */
function boot(){
  var pwaIcon = document.getElementById('pwaIconMain');
  if(pwaIcon) pwaIcon.href = LOGO_DATA_URI;
  document.getElementById('fab').onclick = function(){ goto('typepick'); };
  document.getElementById('btnClosePreview').onclick = closePreview;
  document.getElementById('btnPreviewBack').onclick = closePreview;
  document.getElementById('btnPreviewConfirm').onclick = function(){
    closePreview();
    if(STATE.current) exportPDF(STATE.current);
  };
  document.getElementById('btnCloseCalc').onclick = closeCalcModal;
  bindQaModal();
  bindArrowDownNav();

  var c = sbClient();
  if(!c){
    // Supabase 函式庫沒載入成功（例如離線）：直接顯示登入畫面並提示錯誤，避免整頁空白。
    STATE.authError = '無法連線到帳號系統，請確認網路連線後重新整理頁面。';
    render();
    return;
  }
  c.auth.getSession().then(function(r){
    var session = r && r.data && r.data.session;
    if(session){
      onAuthReady(session);
    } else {
      STATE.view = 'auth';
      render();
    }
  }).catch(function(){
    STATE.view = 'auth';
    render();
  });

  c.auth.onAuthStateChange(function(event, session){
    if(event==='SIGNED_OUT'){
      if(STATE.view!=='auth'){ STATE.session=null; STATE.current=null; STATE.quotes=[]; STATE.view='auth'; render(); }
      return;
    }
    if(session) STATE.session = session; // 保持 session 最新（例如 token 自動更新）
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    if(!STATE.session) return;
    syncFromCloud(function(){
      listQuotes(function(list){
        STATE.quotes = list;
        if(STATE.view==='home') render();
      });
    });
  });
}

// 電腦輸入時，按「向下鍵」跳到下一個欄位（依畫面上的欄位順序），不用滑鼠點選或按 Tab。
// 只在目前焦點是單行文字類 input 時觸發，避免影響 textarea 內的正常換行游標移動。
function bindArrowDownNav(){
  document.addEventListener('keydown', function(e){
    if(e.key!=='ArrowDown') return;
    var el = e.target;
    if(!el || el.tagName!=='INPUT') return;
    var type = (el.type||'text').toLowerCase();
    if(['checkbox','radio','button','file','submit','range','color'].indexOf(type)>-1) return;
    var view = document.getElementById('view');
    if(!view || !view.contains(el)) return;
    var focusables = Array.prototype.slice.call(view.querySelectorAll('input, textarea, select')).filter(function(x){
      return !x.disabled && x.offsetParent!==null;
    });
    var idx = focusables.indexOf(el);
    if(idx>-1 && idx<focusables.length-1){
      e.preventDefault();
      var next = focusables[idx+1];
      next.focus();
      if(next.tagName==='INPUT' && next.select) next.select();
    }
  });
}
boot();
